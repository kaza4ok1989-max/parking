
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking · Fahrzeugkarte</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 12px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    input, select, button {
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }

    input { min-width: 150px; }

    button { cursor: pointer; }

    #search {
      flex: 1;
      min-width: 180px;
    }

    #addCarButton {
      background: #16a34a;
      color: white;
      border: none;
      font-weight: bold;
    }

    #authButton {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: bold;
    }

    #logoutButton {
      background: #475569;
      color: white;
      border: none;
    }

    #addCarButton, #logoutButton {
      display: none;
    }

    #authInfo {
      font-size: 12px;
      color: #d1fae5;
      overflow-wrap: anywhere;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 12px;
    }

    #status {
      margin-bottom: 8px;
      color: #475569;
      font-size: 13px;
    }

    #placementMessage {
      display: none;
      margin-bottom: 8px;
      padding: 10px;
      background: #fef9c3;
      border: 1px solid #eab308;
      border-radius: 8px;
      font-weight: bold;
    }

    #mapWrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ddd;
    }

    #parkingImage {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    #markers {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Машинка: точка координат находится в центре кузова,
       а подпись VIN не сдвигает эту точку. */
    .marker {
      position: absolute;
      width: 36px;
      height: 36px;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      touch-action: none;
      cursor: pointer;
      z-index: 5;
      overflow: visible;
    }

    .marker.admin {
      cursor: grab;
    }

    .marker.admin:active {
      cursor: grabbing;
    }

    .marker.hidden {
      opacity: 0.12;
    }

    .carShape {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 34px;
      transform: translate(-50%, -50%);
      background: var(--car-color, white);
      border: 1.5px solid #202020;
      border-radius: 6px;
      box-shadow: 0 2px 4px rgba(0,0,0,.45);
    }

    .frontWindow, .rearWindow, .roof,
    .wheel, .headlight {
      position: absolute;
    }

    .frontWindow {
      top: 5px;
      left: 3px;
      right: 3px;
      height: 7px;
      background: #334155;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 3px 3px 1px 1px;
    }

    .rearWindow {
      bottom: 5px;
      left: 4px;
      right: 4px;
      height: 6px;
      background: #334155;
      border-radius: 1px 1px 3px 3px;
    }

    .roof {
      top: 14px;
      bottom: 13px;
      left: 4px;
      right: 4px;
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 2px;
    }

    .wheel {
      width: 3px;
      height: 8px;
      background: #111;
      border-radius: 2px;
    }

    .wheel.fl { left: -3px; top: 7px; }
    .wheel.fr { right: -3px; top: 7px; }
    .wheel.rl { left: -3px; bottom: 6px; }
    .wheel.rr { right: -3px; bottom: 6px; }

    .headlight {
      top: 1px;
      width: 4px;
      height: 2px;
      background: #fde047;
    }

    .headlight.left { left: 3px; }
    .headlight.right { right: 3px; }

    /* Разные формы автомобилей */
    .carShape.puma {
      width: 21px;
      height: 33px;
      border-radius: 8px 8px 6px 6px;
    }

    .carShape.transit {
      width: 22px;
      height: 41px;
      border-radius: 4px;
    }

    .carShape.transporter {
      width: 24px;
      height: 39px;
      border-radius: 3px;
    }

    .carShape.transporter .roof {
      left: 3px;
      right: 3px;
    }

    .carShape.ranger {
      width: 24px;
      height: 38px;
      border-radius: 5px;
    }

    .carShape.ranger .rearWindow {
      display: none;
    }

    .carShape.ranger .roof {
      bottom: 15px;
    }

    .carShape.ranger::after {
      content: "";
      position: absolute;
      left: 3px;
      right: 3px;
      bottom: 3px;
      height: 10px;
      border: 1px solid rgba(0,0,0,.55);
      background: repeating-linear-gradient(
        90deg,
        transparent 0 2px,
        rgba(0,0,0,.16) 2px 3px
      );
    }

    .carShape.kuga {
      width: 24px;
      height: 35px;
      border-radius: 7px;
    }

    .carShape.capri {
      width: 20px;
      height: 34px;
      border-radius: 10px 10px 5px 5px;
    }

    .carShape.focus {
      width: 21px;
      height: 34px;
      border-radius: 6px;
    }

    .carShape.opel {
      width: 22px;
      height: 34px;
      border-radius: 9px 9px 6px 6px;
    }

    .carShape.skoda {
      width: 22px;
      height: 35px;
      border-radius: 4px 4px 6px 6px;
    }

    .carVin {
      position: absolute;
      left: 50%;
      top: calc(50% + 23px);
      transform: translateX(-50%);
      min-width: 31px;
      padding: 1px 3px;
      border: 1px solid #333;
      border-radius: 3px;
      background: white;
      color: #111;
      font-size: 7px;
      line-height: 9px;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }

    /* Окна */
    .panel {
      display: none;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 450px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 18px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
      z-index: 30;
    }

    #addPanel, #loginPanel {
      top: 70px;
    }

    #card {
      bottom: 18px;
    }

    .panel h2 {
      margin: 0 0 14px;
    }

    .formRow {
      margin-bottom: 10px;
    }

    .formRow label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: bold;
    }

    .formRow input,
    .formRow select {
      width: 100%;
    }

    .panelActions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .panelActions button {
      flex: 1;
    }

    .primaryButton {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: bold;
    }

    .dangerButton {
      background: #dc2626;
      color: white;
      border: none;
      font-weight: bold;
    }

    .fullButton {
      width: 100%;
      margin-top: 8px;
    }

    .mobileButton {
      display: block;
      margin-top: 8px;
      padding: 11px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
    }

    .closeButton {
      float: right;
      width: 34px;
      height: 34px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #e5e7eb;
      font-size: 20px;
    }

    @media (max-width: 700px) {
      main { padding: 6px; }
      header { padding: 8px; }
      .marker { width: 32px; height: 32px; }
      .carShape { scale: .9; }
    }
  </style>
</head>

<body>

<header>
  <h1>Parking · Fahrzeugkarte</h1>

  <div class="toolbar">
    <input
      id="search"
      type="search"
      placeholder="VIN oder Fahrzeugnummer suchen"
    >

    <select id="modelFilter">
      <option value="">Alle Modelle</option>
      <option value="Ford Puma">Ford Puma</option>
      <option value="Ford Transit">Ford Transit</option>
      <option value="Transporter">Transporter</option>
      <option value="Ford Ranger">Ford Ranger</option>
      <option value="Ford Kuga">Ford Kuga</option>
      <option value="Ford Capri">Ford Capri</option>
      <option value="Ford Focus">Ford Focus</option>
      <option value="Opel">Opel</option>
      <option value="Škoda">Škoda</option>
    </select>

    <select id="colorFilter">
      <option value="">Alle Farben</option>
      <option value="White">Weiß</option>
      <option value="Black">Schwarz</option>
      <option value="Red">Rot</option>
      <option value="Orange">Orange</option>
      <option value="Green">Grün</option>
      <option value="Blue">Blau</option>
      <option value="Gray">Grau</option>
      <option value="Silver">Silber</option>
    </select>

    <button id="addCarButton" type="button">
      + Fahrzeug hinzufügen
    </button>

    <button id="authButton" type="button">
      Admin · Anmelden
    </button>

    <button id="logoutButton" type="button">
      Abmelden
    </button>

    <span id="authInfo"></span>
  </div>
</header>

<main>
  <div id="status">Fahrzeuge werden geladen...</div>

  <div id="placementMessage">
    Klicke jetzt auf die gewünschte Position auf dem Parkplatz.
  </div>

  <div id="mapWrapper">
    <img
      id="parkingImage"
      src="./parking.png?v=3"
      alt="Parkplatz"
    >
    <div id="markers"></div>
  </div>
</main>

<!-- ВХОД АДМИНИСТРАТОРА -->
<div id="loginPanel" class="panel">
  <button id="closeLogin" class="closeButton" type="button">×</button>
  <h2>Admin · Anmelden</h2>

  <div class="formRow">
    <label for="loginEmail">E-Mail</label>
    <input
      id="loginEmail"
      type="email"
      autocomplete="username"
      placeholder="E-Mail"
    >
  </div>

  <div class="formRow">
    <label for="loginPassword">Passwort</label>
    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
      placeholder="Passwort"
    >
  </div>

  <button id="loginButton" class="primaryButton fullButton" type="button">
    Anmelden
  </button>

  <p id="loginMessage" style="font-size:13px;color:#b91c1c;"></p>
</div>

<!-- ДОБАВЛЕНИЕ -->
<div id="addPanel" class="panel">
  <h2>Fahrzeug hinzufügen</h2>

  <div class="formRow">
    <label for="newVin">VIN</label>
    <input id="newVin" type="text" placeholder="z.B. 02236">
  </div>

  <div class="formRow">
    <label for="newFahrnummer">Fahrzeugnummer</label>
    <input id="newFahrnummer" type="text" placeholder="z.B. TZ-B504">
  </div>

  <div class="formRow">
    <label for="newModel">Modell</label>
    <select id="newModel">
      <option value="Ford Puma">Ford Puma</option>
      <option value="Ford Transit">Ford Transit</option>
      <option value="Transporter">Transporter</option>
      <option value="Ford Ranger">Ford Ranger</option>
      <option value="Ford Kuga">Ford Kuga</option>
      <option value="Ford Capri">Ford Capri</option>
      <option value="Ford Focus">Ford Focus</option>
      <option value="Opel">Opel</option>
      <option value="Škoda">Škoda</option>
    </select>
  </div>

  <div class="formRow">
    <label for="newColor">Farbe</label>
    <select id="newColor">
      <option value="White">Weiß</option>
      <option value="Black">Schwarz</option>
      <option value="Red">Rot</option>
      <option value="Orange">Orange</option>
      <option value="Green">Grün</option>
      <option value="Blue">Blau</option>
      <option value="Gray">Grau</option>
      <option value="Silver">Silber</option>
    </select>
  </div>

  <div class="formRow">
    <label for="newMobileUrl">Mobile.de URL</label>
    <input id="newMobileUrl" type="url" placeholder="https://...">
  </div>

  <div class="panelActions">
    <button id="cancelAddButton" type="button">Abbrechen</button>
    <button id="placeCarButton" class="primaryButton" type="button">
      Auf Parkplatz setzen
    </button>
  </div>
</div>

<!-- РЕДАКТИРОВАНИЕ -->
<div id="card" class="panel">
  <button id="closeCard" class="closeButton" type="button">×</button>
  <h2 id="cardTitle">Fahrzeug</h2>

  <div class="formRow">
    <label for="editVin">VIN</label>
    <input id="editVin" type="text">
  </div>

  <div class="formRow">
    <label for="editFahrnummer">Fahrzeugnummer</label>
    <input id="editFahrnummer" type="text">
  </div>

  <div class="formRow">
    <label for="editModel">Modell</label>
    <select id="editModel">
      <option value="Ford Puma">Ford Puma</option>
      <option value="Ford Transit">Ford Transit</option>
      <option value="Transporter">Transporter</option>
      <option value="Ford Ranger">Ford Ranger</option>
      <option value="Ford Kuga">Ford Kuga</option>
      <option value="Ford Capri">Ford Capri</option>
      <option value="Ford Focus">Ford Focus</option>
      <option value="Opel">Opel</option>
      <option value="Škoda">Škoda</option>
    </select>
  </div>

  <div class="formRow">
    <label for="editColor">Farbe</label>
    <select id="editColor">
      <option value="White">Weiß</option>
      <option value="Black">Schwarz</option>
      <option value="Red">Rot</option>
      <option value="Orange">Orange</option>
      <option value="Green">Grün</option>
      <option value="Blue">Blau</option>
      <option value="Gray">Grau</option>
      <option value="Silver">Silber</option>
    </select>
  </div>

  <div class="formRow">
    <label for="editMobileUrl">Mobile.de URL</label>
    <input id="editMobileUrl" type="url" placeholder="https://...">
  </div>

  <button
    id="saveCarButton"
    class="primaryButton fullButton"
    type="button"
  >
    Änderungen speichern
  </button>

  <a
    id="mobileButton"
    class="mobileButton"
    target="_blank"
    rel="noopener noreferrer"
  >
    Mobile.de öffnen
  </a>

  <button
    id="deleteCarButton"
    class="dangerButton fullButton"
    type="button"
  >
    Fahrzeug löschen
  </button>
</div>

<script>
  /* SUPABASE */
  const SUPABASE_URL =
    "https://cydestwofhdfsmekwxho.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_LNyn0n-rbQfu5AIMeAt9XQ_zqSpQ3Dh";

  const SESSION_KEY = "parking_admin_session";

  let cars = [];
  let session = null;
  let selectedCar = null;
  let pendingCar = null;
  let placementMode = false;
  let dragging = false;

  const $ = id => document.getElementById(id);

  const markers = $("markers");
  const mapWrapper = $("mapWrapper");
  const status = $("status");
  const card = $("card");
  const addPanel = $("addPanel");
  const loginPanel = $("loginPanel");

  function isAdmin() {
    return Boolean(session && session.access_token);
  }

  function setStatus(message) {
    status.textContent = message;
  }

  function closePanels() {
    card.style.display = "none";
    addPanel.style.display = "none";
    loginPanel.style.display = "none";
  }

  function updateAdminUI() {
    const admin = isAdmin();

    $("addCarButton").style.display = admin ? "inline-block" : "none";
    $("authButton").style.display = admin ? "none" : "inline-block";
    $("logoutButton").style.display = admin ? "inline-block" : "none";

    $("authInfo").textContent = admin
      ? (session.user?.email || "Admin")
      : "";

    if (!admin) {
      placementMode = false;
      pendingCar = null;
      $("placementMessage").style.display = "none";
      closePanels();
    }

    renderCars();
  }

  /* AUTH */
  async function authRequest(path, options = {}) {
    const response = await fetch(
      SUPABASE_URL + "/auth/v1/" + path,
      {
        ...options,
        headers: {
          apikey: SUPABASE_KEY,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.msg ||
        data.error_description ||
        data.message ||
        data.error ||
        "Anmeldung fehlgeschlagen."
      );
    }

    return data;
  }

  function saveSession(value) {
    session = value;

    if (value) {
      localStorage.setItem(SESSION_KEY, JSON.stringify(value));
    } else {
      localStorage.removeItem(SESSION_KEY);
    }

    updateAdminUI();
  }

  async function refreshSession() {
    if (!session?.refresh_token) {
      saveSession(null);
      return false;
    }

    try {
      const refreshed = await authRequest(
        "token?grant_type=refresh_token",
        {
          method: "POST",
          body: JSON.stringify({
            refresh_token: session.refresh_token
          })
        }
      );

      saveSession(refreshed);
      return true;
    } catch (error) {
      console.error(error);
      saveSession(null);
      return false;
    }
  }

  async function restoreSession() {
    try {
      const stored = localStorage.getItem(SESSION_KEY);

      if (!stored) {
        updateAdminUI();
        return;
      }

      session = JSON.parse(stored);

      if (!session?.access_token) {
        saveSession(null);
        return;
      }

      const expiresAt = session.expires_at || 0;
      const now = Math.floor(Date.now() / 1000);

      if (expiresAt && expiresAt <= now + 60) {
        await refreshSession();
      } else {
        /* Проверяем токен через Supabase */
        const user = await authRequest("user", {
          headers: {
            Authorization: "Bearer " + session.access_token
          }
        });

        session.user = user;
        updateAdminUI();
      }
    } catch (error) {
      console.error(error);

      if (!(await refreshSession())) {
        saveSession(null);
      }
    }
  }

  $("authButton").addEventListener("click", () => {
    closePanels();
    $("loginMessage").textContent = "";
    $("loginPanel").style.display = "block";
  });

  $("closeLogin").addEventListener("click", () => {
    loginPanel.style.display = "none";
    $("loginPassword").value = "";
  });

  $("loginButton").addEventListener("click", async () => {
    const email = $("loginEmail").value.trim();
    const password = $("loginPassword").value;

    if (!email || !password) {
      $("loginMessage").textContent =
        "Bitte E-Mail und Passwort eingeben.";
      return;
    }

    $("loginButton").disabled = true;
    $("loginMessage").textContent = "Anmeldung läuft...";

    try {
      const result = await authRequest(
        "token?grant_type=password",
        {
          method: "POST",
          body: JSON.stringify({ email, password })
        }
      );

      saveSession(result);

      $("loginPassword").value = "";
      $("loginMessage").textContent = "";
      loginPanel.style.display = "none";

      setStatus("Als Administrator angemeldet.");
      await loadCars();
    } catch (error) {
      console.error(error);
      $("loginMessage").textContent =
        "Anmeldung fehlgeschlagen. E-Mail und Passwort prüfen.";
    } finally {
      $("loginButton").disabled = false;
    }
  });

  $("loginPassword").addEventListener("keydown", event => {
    if (event.key === "Enter") {
      $("loginButton").click();
    }
  });

  $("logoutButton").addEventListener("click", async () => {
    const token = session?.access_token;

    saveSession(null);
    setStatus("Abgemeldet.");

    if (token) {
      try {
        await fetch(SUPABASE_URL + "/auth/v1/logout", {
          method: "POST",
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: "Bearer " + token
          }
        });
      } catch (error) {
        console.error(error);
      }
    }

    await loadCars();
  });

  /* API */
  async function apiRequest(path, options = {}, retry = true) {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/" + path,
      {
        ...options,
        headers: {
          apikey: SUPABASE_KEY,
          Authorization:
            "Bearer " +
            (session?.access_token || SUPABASE_KEY),
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      }
    );

    if (
      response.status === 401 &&
      retry &&
      session?.refresh_token
    ) {
      const refreshed = await refreshSession();

      if (refreshed) {
        return apiRequest(path, options, false);
      }
    }

    if (!response.ok) {
      throw new Error(await response.text());
    }

    return response;
  }

  async function loadCars() {
    try {
      const response = await apiRequest(
        "cars?select=*&order=id.asc"
      );

      cars = await response.json();
      renderCars();
    } catch (error) {
      console.error(error);
      setStatus("Fehler beim Laden der Fahrzeuge.");
    }
  }

  /* МОДЕЛЬ И ЦВЕТ */
  function getVehicleType(model) {
    const m = (model || "").toLowerCase();

    if (m.includes("puma")) return "puma";
    if (m.includes("transporter")) return "transporter";
    if (m.includes("transit")) return "transit";
    if (m.includes("ranger")) return "ranger";
    if (m.includes("kuga")) return "kuga";
    if (m.includes("capri")) return "capri";
    if (m.includes("focus")) return "focus";
    if (m.includes("opel")) return "opel";
    if (m.includes("škoda") || m.includes("skoda")) return "skoda";

    return "focus";
  }

  function getCarColor(color) {
    const c = (color || "").toLowerCase();

    if (c.includes("white") || c.includes("weiß")) return "#ffffff";
    if (c.includes("black") || c.includes("schwarz")) return "#171717";
    if (c.includes("red") || c.includes("rot")) return "#dc2626";
    if (c.includes("orange")) return "#f97316";
    if (c.includes("green") || c.includes("grün")) return "#16a34a";
    if (c.includes("blue") || c.includes("blau")) return "#2563eb";

    if (
      c.includes("gray") ||
      c.includes("grey") ||
      c.includes("grau")
    ) return "#6b7280";

    if (c.includes("silver") || c.includes("silber")) {
      return "#cbd5e1";
    }

    return "#ffffff";
  }

  function carMatches(car) {
    const q = $("search").value.trim().toLowerCase();

    const text = [
      car.vin5 || "",
      car.fahrnummer || "",
      car.model || ""
    ].join(" ").toLowerCase();

    if (q && !text.includes(q)) return false;

    if (
      $("modelFilter").value &&
      car.model !== $("modelFilter").value
    ) return false;

    if (
      $("colorFilter").value &&
      car.color !== $("colorFilter").value
    ) return false;

    return true;
  }

  function createCarGraphic(car) {
    const shape = document.createElement("div");

    shape.className =
      "carShape " + getVehicleType(car.model);

    shape.style.setProperty(
      "--car-color",
      getCarColor(car.color)
    );

    const parts = [
      "frontWindow",
      "roof",
      "rearWindow",
      "wheel fl",
      "wheel fr",
      "wheel rl",
      "wheel rr",
      "headlight left",
      "headlight right"
    ];

    parts.forEach(className => {
      const part = document.createElement("div");
      part.className = className;
      shape.appendChild(part);
    });

    return shape;
  }

  /* КООРДИНАТЫ ОТНОСИТЕЛЬНО ФОТО */
  function getMapPercent(clientX, clientY) {
    const rect = $("parkingImage").getBoundingClientRect();

    let x = ((clientX - rect.left) / rect.width) * 100;
    let y = ((clientY - rect.top) / rect.height) * 100;

    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));

    return {
      x: Number(x.toFixed(4)),
      y: Number(y.toFixed(4))
    };
  }

  /* ОТОБРАЖЕНИЕ МАШИН */
  function renderCars() {
    markers.innerHTML = "";
    let visibleCount = 0;

    cars.forEach(car => {
      if (
        car.position_x == null ||
        car.position_y == null
      ) return;

      const marker = document.createElement("button");

      marker.type = "button";
      marker.className = "marker";

      if (isAdmin()) {
        marker.classList.add("admin");
      }

      marker.style.left = car.position_x + "%";
      marker.style.top = car.position_y + "%";

      marker.appendChild(createCarGraphic(car));

      const vin = document.createElement("span");
      vin.className = "carVin";
      vin.textContent = car.vin5 || "?";
      marker.appendChild(vin);

      marker.title = [
        car.model || "",
        car.vin5 || "",
        car.fahrnummer || ""
      ].filter(Boolean).join(" · ");

      if (!carMatches(car)) {
        marker.classList.add("hidden");
      } else {
        visibleCount++;
      }

      if (isAdmin()) {
        enableDrag(marker, car);
      }

      marker.addEventListener("click", () => {
        if (!dragging) {
          showCar(car);
        }
      });

      markers.appendChild(marker);
    });

    setStatus(
      visibleCount +
      " Fahrzeug" +
      (visibleCount === 1 ? "" : "e") +
      " angezeigt"
    );
  }

  /* ПЕРЕМЕЩЕНИЕ: ТОЛЬКО ПОСЛЕ ВХОДА */
  function enableDrag(marker, car) {
    let startX = 0;
    let startY = 0;
    let moved = false;

    marker.addEventListener("pointerdown", event => {
      if (!isAdmin() || placementMode) return;

      dragging = false;
      moved = false;

      startX = event.clientX;
      startY = event.clientY;

      marker.setPointerCapture(event.pointerId);
    });

    marker.addEventListener("pointermove", event => {
      if (!marker.hasPointerCapture(event.pointerId)) {
        return;
      }

      const distance = Math.hypot(
        event.clientX - startX,
        event.clientY - startY
      );

      if (distance > 4) {
        moved = true;
        dragging = true;
      }

      if (!moved) return;

      const pos = getMapPercent(
        event.clientX,
        event.clientY
      );

      marker.style.left = pos.x + "%";
      marker.style.top = pos.y + "%";
    });

    marker.addEventListener("pointerup", async event => {
      if (!marker.hasPointerCapture(event.pointerId)) {
        return;
      }

      marker.releasePointerCapture(event.pointerId);

      if (!moved) return;

      const pos = getMapPercent(
        event.clientX,
        event.clientY
      );

      try {
        setStatus("Position wird gespeichert...");

        await apiRequest(
          `cars?id=eq.${car.id}`,
          {
            method: "PATCH",
            headers: {
              Prefer: "return=minimal"
            },
            body: JSON.stringify({
              position_x: pos.x,
              position_y: pos.y
            })
          }
        );

        car.position_x = pos.x;
        car.position_y = pos.y;

        setStatus("Position gespeichert.");
      } catch (error) {
        console.error(error);
        alert("Position konnte nicht gespeichert werden.");
      } finally {
        renderCars();

        /* Не открываем карточку после перетаскивания */
        setTimeout(() => {
          dragging = false;
        }, 100);
      }
    });

    marker.addEventListener("pointercancel", () => {
      dragging = false;
      renderCars();
    });
  }

  /* КАРТОЧКА МАШИНЫ */
  function setSelectValue(select, value) {
    const exists = Array.from(select.options)
      .some(option => option.value === value);

    if (!exists && value) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    }

    select.value = value || select.options[0]?.value || "";
  }

  function updateMobileButton(url) {
    const button = $("mobileButton");

    if (
      url &&
      /^https?:\/\//i.test(url)
    ) {
      button.href = url;
      button.style.display = "block";
    } else {
      button.removeAttribute("href");
      button.style.display = "none";
    }
  }

  function showCar(car) {
    selectedCar = car;

    $("cardTitle").textContent =
      car.model || "Fahrzeug";

    $("editVin").value = car.vin5 || "";
    $("editFahrnummer").value = car.fahrnummer || "";

    setSelectValue($("editModel"), car.model);
    setSelectValue($("editColor"), car.color);

    $("editMobileUrl").value = car.mobile_url || "";

    const admin = isAdmin();

    [
      "editVin",
      "editFahrnummer",
      "editModel",
      "editColor",
      "editMobileUrl"
    ].forEach(id => {
      $(id).disabled = !admin;
    });

    $("saveCarButton").style.display =
      admin ? "block" : "none";

    $("deleteCarButton").style.display =
      admin ? "block" : "none";

    updateMobileButton(car.mobile_url);

    addPanel.style.display = "none";
    card.style.display = "block";
  }

  $("closeCard").addEventListener("click", () => {
    selectedCar = null;
    card.style.display = "none";
  });

  /* СОХРАНИТЬ ИЗМЕНЕНИЯ */
  $("saveCarButton").addEventListener("click", async () => {
    if (!isAdmin() || !selectedCar) return;

    const vin = $("editVin").value.trim();
    const fahrnummer = $("editFahrnummer").value.trim();
    const model = $("editModel").value;
    const color = $("editColor").value;
    const mobileUrl = $("editMobileUrl").value.trim();

    if (!vin || !fahrnummer) {
      alert("Bitte VIN und Fahrzeugnummer eingeben.");
      return;
    }

    $("saveCarButton").disabled = true;

    try {
      setStatus("Änderungen werden gespeichert...");

      await apiRequest(
        `cars?id=eq.${selectedCar.id}`,
        {
          method: "PATCH",
          headers: {
            Prefer: "return=minimal"
          },
          body: JSON.stringify({
            vin5: vin,
            fahrnummer,
            model,
            color,
            mobile_url: mobileUrl
          })
        }
      );

      Object.assign(selectedCar, {
        vin5: vin,
        fahrnummer,
        model,
        color,
        mobile_url: mobileUrl
      });

      $("cardTitle").textContent = model;
      updateMobileButton(mobileUrl);

      renderCars();
      setStatus("Änderungen gespeichert.");
    } catch (error) {
      console.error(error);
      alert("Änderungen konnten nicht gespeichert werden.");
    } finally {
      $("saveCarButton").disabled = false;
    }
  });

  /* УДАЛЕНИЕ */
  $("deleteCarButton").addEventListener("click", async () => {
    if (!isAdmin() || !selectedCar) return;

    const confirmed = confirm(
      `Fahrzeug ${selectedCar.vin5 || ""} wirklich löschen?`
    );

    if (!confirmed) return;

    const id = selectedCar.id;

    try {
      setStatus("Fahrzeug wird gelöscht...");

      await apiRequest(
        `cars?id=eq.${id}`,
        {
          method: "DELETE",
          headers: {
            Prefer: "return=minimal"
          }
        }
      );

      cars = cars.filter(car => car.id !== id);

      selectedCar = null;
      card.style.display = "none";

      renderCars();
      setStatus("Fahrzeug gelöscht.");
    } catch (error) {
      console.error(error);
      alert("Fahrzeug konnte nicht gelöscht werden.");
    }
  });

  /* ДОБАВЛЕНИЕ */
  $("addCarButton").addEventListener("click", () => {
    if (!isAdmin()) return;

    selectedCar = null;
    closePanels();
    addPanel.style.display = "block";
  });

  $("cancelAddButton").addEventListener("click", () => {
    addPanel.style.display = "none";
    placementMode = false;
    pendingCar = null;
    $("placementMessage").style.display = "none";
  });

  $("placeCarButton").addEventListener("click", () => {
    if (!isAdmin()) return;

    const vin = $("newVin").value.trim();
    const fahrnummer = $("newFahrnummer").value.trim();

    if (!vin || !fahrnummer) {
      alert("Bitte VIN und Fahrzeugnummer eingeben.");
      return;
    }

    pendingCar = {
      vin5: vin,
      fahrnummer,
      model: $("newModel").value,
      color: $("newColor").value,
      mobile_url: $("newMobileUrl").value.trim()
    };

    placementMode = true;
    addPanel.style.display = "none";

    $("placementMessage").textContent =
      "Klicke jetzt auf die gewünschte Position auf dem Parkplatz.";

    $("placementMessage").style.display = "block";
  });

  mapWrapper.addEventListener("click", async event => {
    if (!isAdmin() || !placementMode || !pendingCar) {
      return;
    }

    if (event.target.closest(".marker")) {
      return;
    }

    const pos = getMapPercent(
      event.clientX,
      event.clientY
    );

    const newCar = {
      ...pendingCar,
      position_x: pos.x,
      position_y: pos.y
    };

    placementMode = false;

    try {
      $("placementMessage").textContent =
        "Fahrzeug wird gespeichert...";

      const response = await apiRequest(
        "cars",
        {
          method: "POST",
          headers: {
            Prefer: "return=representation"
          },
          body: JSON.stringify(newCar)
        }
      );

      const created = await response.json();

      if (created[0]) {
        cars.push(created[0]);
      }

      pendingCar = null;
      $("placementMessage").style.display = "none";

      $("newVin").value = "";
      $("newFahrnummer").value = "";
      $("newMobileUrl").value = "";

      renderCars();
    } catch (error) {
      console.error(error);

      alert("Fahrzeug konnte nicht gespeichert werden.");

      placementMode = true;
      $("placementMessage").textContent =
        "Fehler beim Speichern. Bitte erneut auf den Parkplatz klicken.";
    }
  });

  /* ФИЛЬТРЫ */
  $("search").addEventListener("input", renderCars);
  $("modelFilter").addEventListener("change", renderCars);
  $("colorFilter").addEventListener("change", renderCars);

  /* ЗАПУСК */
  async function start() {
    await restoreSession();
    await loadCars();
  }

  start();
</script>
