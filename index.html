<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parking · Fahrzeugkarte</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #111;
    }

    header {
      background: #111827;
      color: white;
      padding: 12px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .toolbar {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }

    input,
    select,
    button {
      min-height: 40px;
      padding: 8px 11px;
      border-radius: 7px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    input {
      flex: 1;
      min-width: 170px;
    }

    button {
      cursor: pointer;
    }

    #addCarButton {
      background: #16a34a;
      color: white;
      border: 0;
      font-weight: bold;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 12px;
    }

    #status {
      margin-bottom: 8px;
      font-size: 13px;
      color: #555;
    }

    #placementMessage {
      display: none;
      margin-bottom: 8px;
      padding: 10px;
      background: #fff7cc;
      border: 1px solid #eab308;
      border-radius: 8px;
      font-weight: bold;
    }

    #mapWrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
      background: #ddd;
      border: 1px solid #ccc;
    }

    #parkingImage {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    #markers {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* =========================
       MARKER
    ========================= */

    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 36px;
      min-height: 52px;

      border: 0;
      margin: 0;
      padding: 0;

      background: transparent;

      pointer-events: auto;
      touch-action: none;

      cursor: grab;

      display: flex;
      flex-direction: column;
      align-items: center;

      z-index: 5;
    }

    .marker:active {
      cursor: grabbing;
    }

    .marker.hidden {
      opacity: 0.15;
    }

    /* =========================
       ALL CARS
    ========================= */

    .carShape {
      position: relative;

      width: 22px;
      height: 36px;

      background: var(--car-color, #fff);

      border: 1.5px solid #222;
      border-radius: 5px;

      box-shadow: 0 2px 4px rgba(0,0,0,.45);

      flex-shrink: 0;
    }

    .frontWindow {
      position: absolute;
      top: 5px;
      left: 3px;
      right: 3px;

      height: 7px;

      background: #374151;

      border-radius: 3px 3px 1px 1px;
    }

    .rearWindow {
      position: absolute;
      bottom: 5px;
      left: 4px;
      right: 4px;

      height: 6px;

      background: #374151;

      border-radius: 1px 1px 3px 3px;
    }

    .roof {
      position: absolute;
      top: 14px;
      bottom: 13px;
      left: 4px;
      right: 4px;

      border: 1px solid rgba(0,0,0,.25);
      border-radius: 2px;
    }

    .wheel {
      position: absolute;

      width: 3px;
      height: 8px;

      background: #111;

      border-radius: 2px;
    }

    .wheel.fl {
      left: -3px;
      top: 7px;
    }

    .wheel.fr {
      right: -3px;
      top: 7px;
    }

    .wheel.rl {
      left: -3px;
      bottom: 6px;
    }

    .wheel.rr {
      right: -3px;
      bottom: 6px;
    }

    .headlight {
      position: absolute;

      top: 1px;

      width: 4px;
      height: 2px;

      background: #fde047;
    }

    .headlight.left {
      left: 3px;
    }

    .headlight.right {
      right: 3px;
    }

    /* =========================
       MODEL SHAPES
    ========================= */

    /* PUMA */
    .carShape.puma {
      width: 22px;
      height: 34px;
      border-radius: 8px 8px 5px 5px;
    }

    /* TRANSIT */
    .carShape.transit {
      width: 23px;
      height: 42px;
      border-radius: 4px;
    }

    .carShape.transit .rearWindow {
      bottom: 4px;
    }

    /* TRANSPORTER */
    .carShape.transporter {
      width: 24px;
      height: 40px;
      border-radius: 3px;
    }

    .carShape.transporter .roof {
      left: 3px;
      right: 3px;
    }

    /* RANGER */
    .carShape.ranger {
      width: 24px;
      height: 39px;
      border-radius: 5px;
    }

    .carShape.ranger::after {
      content: "";
      position: absolute;

      left: 3px;
      right: 3px;
      bottom: 3px;

      height: 10px;

      border: 1px solid rgba(0,0,0,.5);
      border-radius: 1px;

      background:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 2px,
          rgba(0,0,0,.15) 2px,
          rgba(0,0,0,.15) 3px
        );
    }

    .carShape.ranger .rearWindow {
      display: none;
    }

    /* KUGA */
    .carShape.kuga {
      width: 24px;
      height: 36px;
      border-radius: 7px;
    }

    /* CAPRI */
    .carShape.capri {
      width: 22px;
      height: 35px;
      border-radius: 9px 9px 5px 5px;
    }

    .carVin {
      margin-top: 2px;

      min-width: 31px;

      padding: 1px 3px;

      background: white;
      color: #111;

      border: 1px solid #333;
      border-radius: 3px;

      font-size: 7px;
      line-height: 9px;
      font-weight: bold;

      text-align: center;

      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }

    /* =========================
       PANELS
    ========================= */

    #card,
    #addPanel {
      display: none;

      position: fixed;

      left: 50%;

      transform: translateX(-50%);

      width: calc(100% - 30px);
      max-width: 450px;

      background: white;

      border-radius: 14px;

      padding: 18px;

      box-shadow: 0 10px 40px rgba(0,0,0,.3);

      z-index: 30;
    }

    #card {
      bottom: 18px;
      max-height: 90vh;
      overflow-y: auto;
    }

    #addPanel {
      top: 80px;
      max-height: 85vh;
      overflow-y: auto;
    }

    #card h2,
    #addPanel h2 {
      margin: 0 0 14px;
    }

    .formRow {
      margin-bottom: 10px;
    }

    .formRow label {
      display: block;

      margin-bottom: 4px;

      font-size: 13px;
      font-weight: bold;
    }

    .formRow input,
    .formRow select {
      width: 100%;
    }

    #closeCard {
      float: right;

      width: 34px;
      height: 34px;

      padding: 0;

      border: 0;

      border-radius: 50%;

      background: #eee;

      font-size: 19px;
    }

    .panelActions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .panelActions button {
      flex: 1;
    }

    #placeCarButton {
      background: #2563eb;
      color: white;
      border: 0;
      font-weight: bold;
    }

    #saveCarButton {
      width: 100%;

      margin-top: 10px;

      background: #2563eb;
      color: white;

      border: 0;

      font-weight: bold;
    }

    #deleteCarButton {
      width: 100%;

      margin-top: 8px;

      background: #dc2626;
      color: white;

      border: 0;

      font-weight: bold;
    }

    .mobileButton {
      display: block;

      margin-top: 8px;

      padding: 11px;

      background: #16a34a;
      color: white;

      text-decoration: none;
      text-align: center;

      border-radius: 8px;

      font-weight: bold;
    }

    @media (max-width: 700px) {

      main {
        padding: 6px;
      }

      header {
        padding: 8px;
      }

      .marker {
        width: 32px;
      }

      .carShape {
        transform: scale(.9);
      }

    }

  </style>
</head>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://cydestwofhdfsmekwxho.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_LNyn0n-rbQfu5AIMeAt9XQ_zqSpQ3Dh";


let cars = [];

let placementMode = false;

let pendingCar = null;

let selectedCar = null;

let dragged = false;


/* =========================
   ELEMENTS
========================= */

const markers =
  document.getElementById("markers");

const mapWrapper =
  document.getElementById("mapWrapper");

const search =
  document.getElementById("search");

const modelFilter =
  document.getElementById("modelFilter");

const colorFilter =
  document.getElementById("colorFilter");

const status =
  document.getElementById("status");

const addPanel =
  document.getElementById("addPanel");

const card =
  document.getElementById("card");

const placementMessage =
  document.getElementById("placementMessage");


/* =========================
   API
========================= */

async function apiRequest(
  path,
  options = {}
) {

  const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/" +
      path,

      {

        ...options,

        headers: {

          apikey:
            SUPABASE_KEY,

          Authorization:
            "Bearer " +
            SUPABASE_KEY,

          "Content-Type":
            "application/json",

          ...(options.headers || {})

        }

      }

    );


  if (!response.ok) {

    throw new Error(
      await response.text()
    );

  }


  return response;
}


/* =========================
   LOAD
========================= */

async function loadCars() {

  try {

    const response =
      await apiRequest(
        "cars?select=*&order=id.asc"
      );


    cars =
      await response.json();


    renderCars();

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Fehler beim Laden der Fahrzeuge.";

  }

}


/* =========================
   COLOR
========================= */

function getCarColor(color) {

  const c =
    (color || "")
      .toLowerCase();


  if (
    c.includes("white") ||
    c.includes("weiß")
  ) {
    return "#ffffff";
  }


  if (
    c.includes("black") ||
    c.includes("schwarz")
  ) {
    return "#171717";
  }


  if (
    c.includes("red") ||
    c.includes("rot")
  ) {
    return "#dc2626";
  }


  if (
    c.includes("orange")
  ) {
    return "#f97316";
  }


  if (
    c.includes("green") ||
    c.includes("grün")
  ) {
    return "#16a34a";
  }


  if (
    c.includes("blue") ||
    c.includes("blau")
  ) {
    return "#2563eb";
  }


  if (
    c.includes("gray") ||
    c.includes("grey") ||
    c.includes("grau")
  ) {
    return "#6b7280";
  }


  if (
    c.includes("silver") ||
    c.includes("silber")
  ) {
    return "#cbd5e1";
  }


  return "#ffffff";
}


/* =========================
   MODEL TYPE
========================= */

function getVehicleType(model) {

  const m =
    (model || "")
      .toLowerCase();


  if (
    m.includes("puma")
  ) {
    return "puma";
  }


  if (
    m.includes("transporter")
  ) {
    return "transporter";
  }


  if (
    m.includes("transit")
  ) {
    return "transit";
  }


  if (
    m.includes("ranger")
  ) {
    return "ranger";
  }


  if (
    m.includes("kuga")
  ) {
    return "kuga";
  }


  if (
    m.includes("capri")
  ) {
    return "capri";
  }


  return "puma";
}


/* =========================
   FILTER
========================= */

function carMatches(car) {

  const q =
    search.value
      .trim()
      .toLowerCase();


  const text =
    `${car.vin5 || ""}
     ${car.fahrnummer || ""}
     ${car.model || ""}`
      .toLowerCase();


  if (
    q &&
    !text.includes(q)
  ) {
    return false;
  }


  if (
    modelFilter.value &&
    car.model !==
      modelFilter.value
  ) {
    return false;
  }


  if (
    colorFilter.value &&
    car.color !==
      colorFilter.value
  ) {
    return false;
  }


  return true;
}


/* =========================
   CAR GRAPHIC
========================= */

function createCarGraphic(car) {

  const shape =
    document.createElement("div");


  shape.className =
    "carShape " +
    getVehicleType(
      car.model
    );


  shape.style.setProperty(
    "--car-color",
    getCarColor(car.color)
  );


  const frontWindow =
    document.createElement("div");

  frontWindow.className =
    "frontWindow";


  const roof =
    document.createElement("div");

  roof.className =
    "roof";


  const rearWindow =
    document.createElement("div");

  rearWindow.className =
    "rearWindow";


  const wheelFL =
    document.createElement("div");

  wheelFL.className =
    "wheel fl";


  const wheelFR =
    document.createElement("div");

  wheelFR.className =
    "wheel fr";


  const wheelRL =
    document.createElement("div");

  wheelRL.className =
    "wheel rl";


  const wheelRR =
    document.createElement("div");

  wheelRR.className =
    "wheel rr";


  const lightLeft =
    document.createElement("div");

  lightLeft.className =
    "headlight left";


  const lightRight =
    document.createElement("div");

  lightRight.className =
    "headlight right";


  shape.appendChild(
    frontWindow
  );

  shape.appendChild(
    roof
  );

  shape.appendChild(
    rearWindow
  );

  shape.appendChild(
    wheelFL
  );

  shape.appendChild(
    wheelFR
  );

  shape.appendChild(
    wheelRL
  );

  shape.appendChild(
    wheelRR
  );

  shape.appendChild(
    lightLeft
  );

  shape.appendChild(
    lightRight
  );


  return shape;
}


/* =========================
   RENDER
========================= */

function renderCars() {

  markers.innerHTML = "";


  let visibleCount = 0;


  cars.forEach(
    car => {


      if (
        car.position_x == null ||
        car.position_y == null
      ) {
        return;
      }


      const marker =
        document.createElement(
          "button"
        );


      marker.type =
        "button";


      marker.className =
        "marker";


      marker.style.left =
        car.position_x + "%";


      marker.style.top =
        car.position_y + "%";


      const graphic =
        createCarGraphic(car);


      marker.appendChild(
        graphic
      );


      const vin =
        document.createElement(
          "span"
        );


      vin.className =
        "carVin";


      vin.textContent =
        car.vin5 || "?";


      marker.appendChild(
        vin
      );


      if (
        !carMatches(car)
      ) {

        marker.classList.add(
          "hidden"
        );

      }

      else {

        visibleCount++;

      }


      enableDrag(
        marker,
        car
      );


      marker.addEventListener(
        "click",
        () => {

          if (!dragged) {

            showCar(car);

          }

        }
      );


      markers.appendChild(
        marker
      );

    }
  );


  status.textContent =
    visibleCount +
    " Fahrzeug" +
    (
      visibleCount === 1
        ? ""
        : "e"
    ) +
    " angezeigt";

}


/* =========================
   DRAG
========================= */

function enableDrag(
  marker,
  car
) {

  let startX = 0;

  let startY = 0;


  marker.addEventListener(
    "pointerdown",
    event => {


      if (placementMode) {
        return;
      }


      dragged =
        false;


      startX =
        event.clientX;


      startY =
        event.clientY;


      marker.setPointerCapture(
        event.pointerId
      );

    }
  );


  marker.addEventListener(
    "pointermove",
    event => {


      if (
        !marker.hasPointerCapture(
          event.pointerId
        )
      ) {
        return;
      }


      const distance =
        Math.hypot(
          event.clientX -
          startX,

          event.clientY -
          startY
        );


      if (
        distance > 4
      ) {
        dragged = true;
      }


      if (!dragged) {
        return;
      }


      const pos =
        getMapPercent(
          event.clientX,
          event.clientY
        );


      marker.style.left =
        pos.x + "%";


      marker.style.top =
        pos.y + "%";

    }
  );


  marker.addEventListener(
    "pointerup",
    async event => {


      if (
        !marker.hasPointerCapture(
          event.pointerId
        )
      ) {
        return;
      }


      marker.releasePointerCapture(
        event.pointerId
      );


      if (!dragged) {
        return;
      }


      const pos =
        getMapPercent(
          event.clientX,
          event.clientY
        );


      try {

        status.textContent =
          "Position wird gespeichert...";


        await apiRequest(
          `cars?id=eq.${car.id}`,
          {

            method:
              "PATCH",

            headers: {

              Prefer:
                "return=minimal"

            },

            body:
              JSON.stringify({

                position_x:
                  pos.x,

                position_y:
                  pos.y

              })

          }
        );


        car.position_x =
          pos.x;


        car.position_y =
          pos.y;


        status.textContent =
          "Position gespeichert.";


        setTimeout(
          renderCars,
          250
        );

      }

      catch (error) {

        console.error(error);

        alert(
          "Position konnte nicht gespeichert werden."
        );

        renderCars();

      }

    }
  );

}


/* =========================
   MAP POSITION
========================= */

function getMapPercent(
  clientX,
  clientY
) {

  const rect =
    mapWrapper
      .getBoundingClientRect();


  let x =
    (
      (
        clientX -
        rect.left
      )
      /
      rect.width
    )
    *
    100;


  let y =
    (
      (
        clientY -
        rect.top
      )
      /
      rect.height
    )
    *
    100;


  x =
    Math.max(
      0,
      Math.min(
        100,
        x
      )
    );


  y =
    Math.max(
      0,
      Math.min(
        100,
        y
      )
    );


  return {

    x:
      Number(
        x.toFixed(2)
      ),

    y:
      Number(
        y.toFixed(2)
      )

  };

}


/* =========================
   OPEN EDIT
========================= */

function showCar(car) {

  selectedCar =
    car;


  document.getElementById(
    "cardTitle"
  ).textContent =
    car.model ||
    "Fahrzeug bearbeiten";


  document.getElementById(
    "editVin"
  ).value =
    car.vin5 || "";


  document.getElementById(
    "editFahrnummer"
  ).value =
    car.fahrnummer || "";


  setSelectValue(
    document.getElementById(
      "editModel"
    ),
    car.model
  );


  setSelectValue(
    document.getElementById(
      "editColor"
    ),
    car.color
  );


  document.getElementById(
    "editMobileUrl"
  ).value =
    car.mobile_url || "";


  updateMobileButton(
    car.mobile_url
  );


  card.style.display =
    "block";

}


/* =========================
   SELECT VALUE
========================= */

function setSelectValue(
  select,
  value
) {

  const exists =
    Array
      .from(select.options)
      .some(
        option =>
          option.value === value
      );


  if (exists) {

    select.value =
      value;

  }

}


/* =========================
   MOBILE BUTTON
========================= */

function updateMobileButton(url) {

  const button =
    document.getElementById(
      "mobileButton"
    );


  if (url) {

    button.href =
      url;

    button.style.display =
      "block";

  }

  else {

    button.style.display =
      "none";

  }

}


/* =========================
   SAVE EDIT
========================= */

document.getElementById(
  "saveCarButton"
).addEventListener(
  "click",
  async () => {


    if (!selectedCar) {
      return;
    }


    const vin =
      document.getElementById(
        "editVin"
      )
      .value
      .trim();


    const fahrnummer =
      document.getElementById(
        "editFahrnummer"
      )
      .value
      .trim();


    const model =
      document.getElementById(
        "editModel"
      ).value;


    const color =
      document.getElementById(
        "editColor"
      ).value;


    const mobileUrl =
      document.getElementById(
        "editMobileUrl"
      )
      .value
      .trim();


    if (
      !vin ||
      !fahrnummer
    ) {

      alert(
        "Bitte VIN und Fahrzeugnummer eingeben."
      );

      return;

    }


    try {

      status.textContent =
        "Änderungen werden gespeichert...";


      await apiRequest(
        `cars?id=eq.${selectedCar.id}`,
        {

          method:
            "PATCH",

          headers: {

            Prefer:
              "return=minimal"

          },

          body:
            JSON.stringify({

              vin5:
                vin,

              fahrnummer:
                fahrnummer,

              model:
                model,

              color:
                color,

              mobile_url:
                mobileUrl

            })

        }
      );


      selectedCar.vin5 =
        vin;


      selectedCar.fahrnummer =
        fahrnummer;


      selectedCar.model =
        model;


      selectedCar.color =
        color;


      selectedCar.mobile_url =
        mobileUrl;


      document.getElementById(
        "cardTitle"
      ).textContent =
        model;


      updateMobileButton(
        mobileUrl
      );


      renderCars();


      status.textContent =
        "Änderungen gespeichert.";

    }

    catch (error) {

      console.error(error);


      alert(
        "Änderungen konnten nicht gespeichert werden."
      );

    }

  }
);


/* =========================
   DELETE
========================= */

document.getElementById(
  "deleteCarButton"
).addEventListener(
  "click",
  async () => {


    if (!selectedCar) {
      return;
    }


    const confirmed =
      confirm(
        `Fahrzeug ${selectedCar.vin5 || ""} wirklich löschen?`
      );


    if (!confirmed) {
      return;
    }


    try {

      status.textContent =
        "Fahrzeug wird gelöscht...";


      const id =
        selectedCar.id;


      await apiRequest(
        `cars?id=eq.${id}`,
        {

          method:
            "DELETE",

          headers: {

            Prefer:
              "return=minimal"

          }

        }
      );


      cars =
        cars.filter(
          car =>
            car.id !== id
        );


      selectedCar =
        null;


      card.style.display =
        "none";


      renderCars();


      status.textContent =
        "Fahrzeug gelöscht.";

    }

    catch (error) {

      console.error(error);


      alert(
        "Fahrzeug konnte nicht gelöscht werden."
      );

    }

  }
);


/* =========================
   ADD PANEL
========================= */

document.getElementById(
  "addCarButton"
).addEventListener(
  "click",
  () => {


    card.style.display =
      "none";


    selectedCar =
      null;


    addPanel.style.display =
      "block";

  }
);


/* =========================
   CANCEL ADD
========================= */

document.getElementById(
  "cancelAddButton"
).addEventListener(
  "click",
  () => {


    addPanel.style.display =
      "none";


    placementMode =
      false;


    pendingCar =
      null;


    placementMessage.style.display =
      "none";

  }
);


/* =========================
   START PLACEMENT
========================= */

document.getElementById(
  "placeCarButton"
).addEventListener(
  "click",
  () => {


    const vin =
      document.getElementById(
        "newVin"
      )
      .value
      .trim();


    const fahrnummer =
      document.getElementById(
        "newFahrnummer"
      )
      .value
      .trim();


    if (
      !vin ||
      !fahrnummer
    ) {

      alert(
        "Bitte VIN und Fahrzeugnummer eingeben."
      );

      return;

    }


    pendingCar = {

      vin5:
        vin,

      fahrnummer:
        fahrnummer,

      model:
        document.getElementById(
          "newModel"
        ).value,

      color:
        document.getElementById(
          "newColor"
        ).value,

      mobile_url:
        document.getElementById(
          "newMobileUrl"
        )
        .value
        .trim()

    };


    placementMode =
      true;


    addPanel.style.display =
      "none";


    placementMessage.style.display =
      "block";


    placementMessage.textContent =
      "Klicke jetzt auf die gewünschte Position auf dem Parkplatz.";

  }
);


/* =========================
   PLACE CAR
========================= */

mapWrapper.addEventListener(
  "click",
  async event => {


    if (!placementMode) {
      return;
    }


    if (
      event.target.closest(
        ".marker"
      )
    ) {
      return;
    }


    const pos =
      getMapPercent(
        event.clientX,
        event.clientY
      );


    const newCar = {

      ...pendingCar,

      position_x:
        pos.x,

      position_y:
        pos.y

    };


    try {

      placementMessage.textContent =
        "Fahrzeug wird gespeichert...";


      const response =
        await apiRequest(
          "cars",
          {

            method:
              "POST",

            headers: {

              Prefer:
                "return=representation"

            },

            body:
              JSON.stringify(
                newCar
              )

          }
        );


      const created =
        await response.json();


      if (
        created[0]
      ) {

        cars.push(
          created[0]
        );

      }


      placementMode =
        false;


      pendingCar =
        null;


      placementMessage.style.display =
        "none";


      clearAddForm();


      renderCars();

    }

    catch (error) {

      console.error(error);


      alert(
        "Fahrzeug konnte nicht gespeichert werden."
      );


      placementMessage.textContent =
        "Fehler beim Speichern.";

    }

  }
);


/* =========================
   CLEAR FORM
========================= */

function clearAddForm() {

  document.getElementById(
    "newVin"
  ).value = "";


  document.getElementById(
    "newFahrnummer"
  ).value = "";


  document.getElementById(
    "newMobileUrl"
  ).value = "";

}


/* =========================
   CLOSE CARD
========================= */

document.getElementById(
  "closeCard"
).addEventListener(
  "click",
  () => {


    selectedCar =
      null;


    card.style.display =
      "none";

  }
);


/* =========================
   FILTER EVENTS
========================= */

search.addEventListener(
  "input",
  renderCars
);


modelFilter.addEventListener(
  "change",
  renderCars
);


colorFilter.addEventListener(
  "change",
  renderCars
);


/* =========================
   START
========================= */

loadCars();

</script>
