<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking · Fahrzeugkarte</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 12px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    input, select, button {
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font-size: 15px;
    }

    input { min-width: 150px; }
    button { cursor: pointer; }

    #search {
      flex: 1;
      min-width: 180px;
    }

    #addCarButton {
      background: #16a34a;
      color: white;
      border: none;
      font-weight: bold;
    }

    #authButton {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: bold;
    }

    #logoutButton {
      background: #475569;
      color: white;
      border: none;
    }

    #addCarButton, #logoutButton {
      display: none;
    }

    #authInfo {
      font-size: 12px;
      color: #d1fae5;
      overflow-wrap: anywhere;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 12px;
    }

    #status {
      margin-bottom: 8px;
      color: #475569;
      font-size: 13px;
    }

    #placementMessage {
      display: none;
      margin-bottom: 8px;
      padding: 10px;
      background: #fef9c3;
      border: 1px solid #eab308;
      border-radius: 8px;
      font-weight: bold;
    }

    #mapWrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ddd;
    }

    #parkingImage {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    #markers {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .marker {
      position: absolute;
      width: 36px;
      height: 36px;
      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      touch-action: none;
      cursor: pointer;
      z-index: 5;
      overflow: visible;
    }

    .marker.admin { cursor: grab; }
    .marker.admin:active { cursor: grabbing; }

    /* Увеличение машины и VIN при наведении мыши */
    @media (hover: hover) and (pointer: fine) {
      .marker:hover {
        z-index: 1000;
      }

      .marker:hover .carShape {
        transform: translate(-50%, -50%) scale(2);
        box-shadow: 0 4px 12px rgba(0,0,0,.55);
      }

      .marker:hover .carVin {
        top: calc(50% + 43px);
        font-size: 14px;
        line-height: 18px;
        padding: 3px 6px;
        min-width: 55px;
        border: 2px solid #111;
        z-index: 1001;
      }

      .carShape,
      .carVin {
        transition:
          transform 0.15s ease,
          top 0.15s ease,
          font-size 0.15s ease,
          line-height 0.15s ease,
          padding 0.15s ease;
      }
    }

    /* Во время перетаскивания машина сразу обычного размера */
    .marker.dragging .carShape {
      transform: translate(-50%, -50%) scale(1) !important;
      box-shadow: 0 2px 4px rgba(0,0,0,.45) !important;
    }

    .marker.dragging .carVin {
      top: calc(50% + 23px) !important;
      font-size: 7px !important;
      line-height: 9px !important;
      padding: 1px 3px !important;
      min-width: 31px !important;
      border: 1px solid #333 !important;
    }

    .marker.hidden {
      opacity: 0.12;
    }

    .carShape {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 34px;
      transform: translate(-50%, -50%);
      background: var(--car-color, white);
      border: 1.5px solid #202020;
      border-radius: 6px;
      box-shadow: 0 2px 4px rgba(0,0,0,.45);
    }

    .frontWindow, .rearWindow, .roof,
    .wheel, .headlight {
      position: absolute;
    }

    .frontWindow {
      top: 5px;
      left: 3px;
      right: 3px;
      height: 7px;
      background: #334155;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 3px 3px 1px 1px;
    }

    .rearWindow {
      bottom: 5px;
      left: 4px;
      right: 4px;
      height: 6px;
      background: #334155;
      border-radius: 1px 1px 3px 3px;
    }

    .roof {
      top: 14px;
      bottom: 13px;
      left: 4px;
      right: 4px;
      border: 1px solid rgba(0,0,0,.25);
      border-radius: 2px;
    }

    .wheel {
      width: 3px;
      height: 8px;
      background: #111;
      border-radius: 2px;
    }

    .wheel.fl { left: -3px; top: 7px; }
    .wheel.fr { right: -3px; top: 7px; }
    .wheel.rl { left: -3px; bottom: 6px; }
    .wheel.rr { right: -3px; bottom: 6px; }

    .headlight {
      top: 1px;
      width: 4px;
      height: 2px;
      background: #fde047;
    }

    .headlight.left { left: 3px; }
    .headlight.right { right: 3px; }

    .carShape.puma {
      width: 21px;
      height: 33px;
      border-radius: 8px 8px 6px 6px;
    }

    .carShape.transit {
      width: 22px;
      height: 41px;
      border-radius: 4px;
    }

    .carShape.transporter {
      width: 24px;
      height: 39px;
      border-radius: 3px;
    }

    .carShape.transporter .roof {
      left: 3px;
      right: 3px;
    }

    .carShape.ranger,
    .carShape.f150 {
      width: 24px;
      height: 38px;
      border-radius: 5px;
    }

    .carShape.f150 {
      width: 26px;
      height: 42px;
    }

    .carShape.ranger .rearWindow,
    .carShape.f150 .rearWindow {
      display: none;
    }

    .carShape.ranger .roof,
    .carShape.f150 .roof {
      bottom: 15px;
    }

    .carShape.ranger::after,
    .carShape.f150::after {
      content: "";
      position: absolute;
      left: 3px;
      right: 3px;
      bottom: 3px;
      height: 10px;
      border: 1px solid rgba(0,0,0,.55);
      background: repeating-linear-gradient(
        90deg,
        transparent 0 2px,
        rgba(0,0,0,.16) 2px 3px
      );
    }

    .carShape.f150::after {
      height: 13px;
    }

    .carShape.kuga {
      width: 24px;
      height: 35px;
      border-radius: 7px;
    }

    .carShape.capri {
      width: 20px;
      height: 34px;
      border-radius: 10px 10px 5px 5px;
    }

    .carShape.focus {
      width: 21px;
      height: 34px;
      border-radius: 6px;
    }

    .carShape.opel {
      width: 22px;
      height: 34px;
      border-radius: 9px 9px 6px 6px;
    }

    .carShape.skoda {
      width: 22px;
      height: 35px;
      border-radius: 4px 4px 6px 6px;
    }

    .carVin {
      position: absolute;
      left: 50%;
      top: calc(50% + 23px);
      transform: translateX(-50%);
      min-width: 31px;
      padding: 1px 3px;
      border: 1px solid #333;
      border-radius: 3px;
      background: white;
      color: #111;
      font-size: 7px;
      line-height: 9px;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }

    .batteryDot { position:absolute; left:calc(50% + 13px); top:calc(50% - 19px); border:1px solid #fff; border-radius:50%; width:16px; height:16px; font-size:11px; font-weight:bold; line-height:14px; text-align:center; color:white; background:#64748b; z-index:8; pointer-events:none; }
    .batteryDot.ok { background:#16a34a; }
    .batteryDot.due { background:#d97706; }
    .batteryDot.overdue, .batteryDot.charge, .batteryDot.replace { background:#dc2626; }
    .batteryDot.none { background:#64748b; }
    .batteryInfo { background:#f1f5f9; border-radius:8px; padding:10px; margin:10px 0; font-size:14px; }
    .batteryHistory { max-height:200px; overflow:auto; border:1px solid #cbd5e1; border-radius:8px; }
    .batteryEntry { padding:9px; border-bottom:1px solid #e2e8f0; font-size:13px; white-space:pre-line; }
    .batteryEntry:last-child { border:0; }
    .batterySummary { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin:8px 0; }
    .batterySummary button { min-height:34px; font-size:13px; }
    .archiveItem { display:block; width:100%; margin:5px 0; text-align:left; background:white; }
    .panel {
      display: none;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 450px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 18px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
      z-index: 30;
    }

    #addPanel, #loginPanel { top: 70px; }
    #card { bottom: 18px; }

    .panel h2 {
      margin: 0 0 14px;
    }

    .formRow {
      margin-bottom: 10px;
    }

    .formRow label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: bold;
    }

    .formRow input,
    .formRow select {
      width: 100%;
    }

    .panelActions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .panelActions button { flex: 1; }

    .primaryButton {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: bold;
    }

    .dangerButton {
      background: #dc2626;
      color: white;
      border: none;
      font-weight: bold;
    }

    .fullButton {
      width: 100%;
      margin-top: 8px;
    }

    .mobileButton {
      display: block;
      margin-top: 8px;
      padding: 11px;
      background: #16a34a;
      color: white;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
    }

    .closeButton {
      float: right;
      width: 34px;
      height: 34px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #e5e7eb;
      font-size: 20px;
    }

    @media (max-width: 700px) {
      main { padding: 6px; }
      header { padding: 8px; }
      .marker { width: 32px; height: 32px; }
      .carShape { scale: .9; }
    }
  </style>
</head>

<body>

<header>
  <h1>Parking · Fahrzeugkarte</h1>

  <div class="toolbar">
    <input
      id="search"
      type="search"
      placeholder="VIN oder Fahrzeugnummer suchen"
    >

    <select id="modelFilter">
      <option value="">Alle Modelle</option>
      <option value="Ford Puma">Ford Puma</option>
      <option value="Ford Transit">Ford Transit</option>
      <option value="Transporter">Transporter</option>
      <option value="Ford Ranger">Ford Ranger</option>
      <option value="Ford F-150">Ford F-150</option>
      <option value="Ford Kuga">Ford Kuga</option>
      <option value="Ford Capri">Ford Capri</option>
      <option value="Ford Focus">Ford Focus</option>

      <option value="Blue">Blau</option>
      <option value="Gray">Grau</option>
      <option value="Silver">Silber</option>

      <option value="due">Prüfung heute / bald</option>
      <option value="overdue">Prüfung überfällig</option>

      <option value="replace">Ersetzen</option>

    <button id="archiveButton" type="button" style="display:none">Archiv</button>
    <button id="addCarButton" type="button">

    <button id="authButton" type="button">

    <button id="logoutButton" type="button">
      Abmelden

    <span id="authInfo"></span>
  </div>
</header>

<main>
  <div id="status">Fahrzeuge werden geladen...</div>

  <div id="batterySummary" class="batterySummary" style="display:none"></div>
  <div id="placementMessage">
    Klicke jetzt auf die gewünschte Position auf dem Parkplatz.
  </div>

  <div id="mapWrapper">
    <img
      id="parkingImage"
      src="./parking.png?v=3"
      alt="Parkplatz"
    >
    <div id="markers"></div>
  </div>
</main>

<!-- ВХОД АДМИНИСТРАТОРА -->
<div id="loginPanel" class="panel">
  <button id="closeLogin" class="closeButton" type="button">×</button>
  <h2>Admin · Anmelden</h2>

  <div class="formRow">
    <label for="loginEmail">E-Mail</label>
    <input
      id="loginEmail"
      type="email"
      autocomplete="username"
      placeholder="E-Mail"
    >
  </div>

  <div class="formRow">
    <label for="loginPassword">Passwort</label>
    <input
      id="loginPassword"
      type="password"
      autocomplete="current-password"
      placeholder="Passwort"
    >
  </div>

  <button id="loginButton" class="primaryButton fullButton" type="button">
    Anmelden
  </button>

  <p id="loginMessage" style="font-size:13px;color:#b91c1c;"></p>
</div>

<!-- ДОБАВЛЕНИЕ -->
<div id="addPanel" class="panel">
  <h2>Fahrzeug hinzufügen</h2>

  <div class="formRow">
    <label for="newVin">VIN</label>
    <input id="newVin" type="text" placeholder="z.B. 02236">
  </div>

    <div class="formRow"><label for="newVinFull">Vollständige VIN (optional, 17 Zeichen)</label><input id="newVinFull" type="text" maxlength="17"></div>
    <div class="formRow">
      <label for="newFahrnummer">Fahrzeugnummer</label>

  </div>

  <div class="formRow">
    <label for="newModel">Modell</label>
    <select id="newModel">
      <option value="Ford Puma">Ford Puma</option>
      <option value="Ford Transit">Ford Transit</option>
      <option value="Transporter">Transporter</option>

      <option value="Ford Capri">Ford Capri</option>
      <option value="Ford Focus">Ford Focus</option>
      <option value="Opel">Opel</option>
      <option value="Škoda">Škoda</option>

  <div class="formRow">

    <select id="newColor">

      <option value="Black">Schwarz</option>
      <option value="Red">Rot</option>
      <option value="Orange">Orange</option>
      <option value="Yellow">Gelb</option>

      <option value="Gray">Grau</option>

  </div>

  <div class="panelActions">
    <button id="cancelAddButton" type="button">Abbrechen</button>
    <button id="placeCarButton" class="primaryButton" type="button">
      Auf Parkplatz setzen
    </button>
  </div>
</div>

<!-- КАРТОЧКА МАШИНЫ -->
<div id="card" class="panel">
  <button id="closeCard" class="closeButton" type="button">×</button>
  <h2 id="cardTitle">Fahrzeug</h2>

  <div class="formRow">
    <label for="editVin">VIN</label>
    <input id="editVin" type="text">
  </div>

    <div class="formRow">

    </div>
    <div class="formRow">
      <label for="editFahrnummer">Fahrzeugnummer</label>

  </div>

  <div class="formRow">
    <label for="editModel">Modell</label>
    <select id="editModel">

      <option value="Ford Transit">Ford Transit</option>
      <option value="Transporter">Transporter</option>
      <option value="Ford Ranger">Ford Ranger</option>
      <option value="Ford F-150">Ford F-150</option>
      <option value="Ford Kuga">Ford Kuga</option>
      <option value="Ford Capri">Ford Capri</option>

      <option value="Opel">Opel</option>
      <option value="Škoda">Škoda</option>

  </div>

  <div class="formRow">
    <label for="editColor">Farbe</label>
    <select id="editColor">
      <option value="White">Weiß</option>
      <option value="Black">Schwarz</option>
      <option value="Red">Rot</option>
      <option value="Orange">Orange</option>
      <option value="Yellow">Gelb</option>

      <option value="Blue">Blau</option>
      <option value="Gray">Grau</option>
      <option value="Silver">Silber</option>

  <div class="formRow">

  <button
    id="saveCarButton"
    class="primaryButton fullButton"
    type="button"
  >
    Änderungen speichern
  </button>

  <a
    id="mobileButton"
    class="mobileButton"
    target="_blank"
    rel="noopener noreferrer"

    Mobile.de öffnen

  <button id="batteryButton" class="primaryButton fullButton" type="button">🔋 Batterie / Verlauf</button>
  <button id="soldCarButton" class="fullButton" type="button">Verkauft · ins Archiv</button>
  <button id="departedCarButton" class="fullButton" type="button">Abgefahren · ins Archiv</button>
  <button
    id="deleteCarButton"
    class="dangerButton fullButton"
    type="button"
  >
    Fahrzeug endgültig löschen (nur ohne Batteriehistorie)
  </button>
</div>

<!-- BATTERIE / ARCHIV -->
<div id="batteryPanel" class="panel" style="top:35px;max-width:540px">
  <button id="closeBattery" class="closeButton" type="button">×</button>
  <h2 id="batteryTitle">🔋 Batterie</h2>
  <div id="batteryCurrent" class="batteryInfo"></div>
  <h3>Prüfung / Ladung erfassen</h3>
  <div id="batteryForm">
    <div class="formRow"><label for="batteryDate">Datum</label><input type="date" id="batteryDate"></div>
    <div class="formRow"><label for="batteryEvent">Vorgang</label><select id="batteryEvent"><option value="check">Prüfung</option><option value="charge">Ladung</option><option value="check_and_charge">Prüfung und Ladung</option></select></div>
    <div class="formRow"><label for="batteryVoltage">Ruhespannung (V)</label><input type="number" id="batteryVoltage" min="0" max="20" step="0.01" placeholder="12.60"></div>
    <div class="formRow"><label for="batteryTester">Testergebnis</label><select id="batteryTester"><option value="">Nicht angegeben</option><option value="OK">OK</option><option value="Nachladen">Nachladen</option><option value="Ersetzen">Ersetzen</option><option value="Unbekannt">Unbekannt</option></select></div>
    <div class="formRow"><label for="batteryNext">Nächste Prüfung (bei Prüfung +1 Monat)</label><input type="date" id="batteryNext"></div>
    <div class="formRow"><label for="batteryNotes">Notizen</label><input id="batteryNotes" type="text" maxlength="1000" placeholder="Bemerkungen"></div>
    <button id="saveBattery" class="primaryButton fullButton" type="button">Eintrag speichern</button>
  </div>
  <h3>Gesamter Verlauf</h3><div id="batteryHistory" class="batteryHistory"></div>
</div>
<div id="archivePanel" class="panel" style="top:35px;max-width:540px">
  <button id="closeArchive" class="closeButton" type="button">×</button>
  <h2>Fahrzeugarchiv</h2>
  <div class="formRow"><label for="archiveSearch">VIN / Fahrzeugnummer suchen</label><input id="archiveSearch" type="search" placeholder="VIN oder Fahrzeugnummer"></div>
  <div id="archiveList"></div>
</div>

  let cars = [];

  const $ = id => document.getElementById(id);

  /* ВХОД */
  async function authRequest(path, options = {}) {
    const response = await fetch(
      SUPABASE_URL + "/auth/v1/" + path,
      {
        ...options,
        headers: {
          apikey: SUPABASE_KEY,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      }
    );

    const data = await response.json().catch(() => ({}));

    if (!response.ok) {
      throw new Error(
        data.msg ||
        data.error_description ||
        data.message ||
        data.error ||
        "Anmeldung fehlgeschlagen."
      );
    }

    return data;
  }

  function saveSession(value) {
    session = value;

    if (value) {
      if (!value.expires_at && value.expires_in) {
        value.expires_at =
          Math.floor(Date.now() / 1000) +
          Number(value.expires_in);
      }

      localStorage.setItem(
        SESSION_KEY,
        JSON.stringify(value)
      );
    } else {
      localStorage.removeItem(SESSION_KEY);
    }

    updateAdminUI();
  }

  async function refreshSession() {
    if (!session?.refresh_token) {
      saveSession(null);
      return false;
    }

    try {
      const refreshed = await authRequest(
        "token?grant_type=refresh_token",
        {
          method: "POST",
          body: JSON.stringify({
            refresh_token: session.refresh_token
          })
        }
      );

      saveSession(refreshed);
      return true;
    } catch (error) {
      console.error(error);
      saveSession(null);
      return false;
    }
  }

  async function restoreSession() {
    try {
      const stored = localStorage.getItem(SESSION_KEY);

      if (!stored) {
        updateAdminUI();
        return;
      }

      session = JSON.parse(stored);

      if (!session?.access_token) {
        saveSession(null);
        return;
      }

      const expiresAt = session.expires_at || 0;
      const now = Math.floor(Date.now() / 1000);

      if (expiresAt && expiresAt <= now + 60) {
        await refreshSession();
      } else {
        const user = await authRequest("user", {
          headers: {
            Authorization:
              "Bearer " + session.access_token
          }
        });

        session.user = user;
        updateAdminUI();
      }
    } catch (error) {
      console.error(error);

      if (!(await refreshSession())) {
        saveSession(null);
      }
    }
  }

  /* ЗАПРОСЫ К БАЗЕ */
  async function apiRequest(path, options = {}, retry = true) {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/" + path,
      {
        ...options,
        headers: {
          apikey: SUPABASE_KEY,
          Authorization:
            "Bearer " +
            (session?.access_token || SUPABASE_KEY),
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      }
    );

    if (
      response.status === 401 &&
      retry &&
      session?.refresh_token
    ) {
      const refreshed = await refreshSession();

      if (refreshed) {
        return apiRequest(path, options, false);
      }
    }

    if (!response.ok) {
      throw new Error(await response.text());
    }

    return response;
  }

  /*
   * АВТООБНОВЛЕНИЕ
   *
   * Считываем данные из Supabase каждые 3 секунды.
   * Перерисовываем карту только тогда, когда данные
   * действительно изменились.
   *
   * Во время перетаскивания и сохранения не обновляем
   * карту, чтобы машинка не прыгала под курсором.
   */
  async function loadCars(force = false) {
    if (refreshInProgress) return;

    if (
      !force &&
      (dragInProgress || savingInProgress || placementMode)
    ) {
      return;
    }

    if (!force && document.hidden) {
      return;
    }

    refreshInProgress = true;

    try {
      const response = await apiRequest(
        "cars?select=*&order=id.asc"
      );

      const incomingCars = await response.json();
      const snapshot = JSON.stringify(incomingCars);

      if (force || snapshot !== lastCarsSnapshot) {
        cars = incomingCars;
        lastCarsSnapshot = snapshot;

        if (selectedCar) {
          const updatedSelected = cars.find(
            car => car.id === selectedCar.id
          );

          if (updatedSelected) {
            selectedCar = updatedSelected;
          } else {
            selectedCar = null;
            card.style.display = "none";
          }
        }

        renderCars();
      }
    } catch (error) {
      console.error("Auto refresh error:", error);

      if (force) {
        setStatus("Fehler beim Laden der Fahrzeuge.");
      }
    } finally {
      refreshInProgress = false;
    }
  }

  /* BATTERIE: vollständige Historie, nur für Administrator */
  function localISODate(date = new Date()) {
    const y = date.getFullYear(), m = String(date.getMonth()+1).padStart(2,"0"), d = String(date.getDate()).padStart(2,"0");
    return `${y}-${m}-${d}`;
  }
  function nextMonthISO(value) {
    if (!value) return "";
    const [y,m,d] = value.split("-").map(Number);
    const targetYear = y + Math.floor(m/12), targetMonth = m%12 + 1;
    const days = new Date(targetYear,targetMonth,0).getDate();
    return `${targetYear}-${String(targetMonth).padStart(2,"0")}-${String(Math.min(d,days)).padStart(2,"0")}`;
  }
  function germanDate(value) { return value ? value.split("-").reverse().join(".") : "—"; }
  function checksFor(carId) { return batteryChecks.filter(c => Number(c.car_id) === Number(carId)).sort((a,b) => b.checked_at.localeCompare(a.checked_at) || Number(b.id)-Number(a.id)); }
  function batteryState(car) {
    const history = checksFor(car.id);
    if (!history.length) return {kind:"none",label:"Keine Daten"};
    const lastTest = history.find(c => c.event_type === "check" || c.event_type === "check_and_charge");
    if (!lastTest) return {kind:"none",label:"Keine Prüfung"};
    if (lastTest.tester_result === "Ersetzen") return {kind:"replace",label:"Ersetzen"};
    if (lastTest.tester_result === "Nachladen") {
      const chargedAfter = history.some(c => (c.event_type === "charge" || c.event_type === "check_and_charge") && (c.checked_at > lastTest.checked_at || (c.checked_at === lastTest.checked_at && Number(c.id) > Number(lastTest.id))));
      if (!chargedAfter) return {kind:"charge",label:"Nachladen"};
    }
    const next = lastTest.next_check_at || nextMonthISO(lastTest.checked_at);
    const today = localISODate();
    if (next < today) return {kind:"overdue",label:"Überfällig",next};
    const soon = new Date(); soon.setDate(soon.getDate()+7);
    if (next <= localISODate(soon)) return {kind:"due",label:"Prüfung fällig",next};
    return {kind:"ok",label:"OK",next};
  }
  async function loadBatteryChecks() {
    if (!isAdmin() || savingInProgress || dragInProgress || document.hidden) return;
    try {
      const response = await apiRequest("battery_checks?select=*&order=checked_at.desc,id.desc&limit=10000");
      const data = await response.json();
      if (JSON.stringify(data) !== JSON.stringify(batteryChecks)) {
        batteryChecks = data;
        renderCars();
        if ($("batteryPanel").style.display === "block") renderBatteryPanel();
      }
      batteryLoaded = true;
    } catch(error) { console.error("Batterie laden:",error); }
  }

    el.textContent = `🔋 Überfällig: ${count("overdue")} · Bald fällig: ${count("due")} · Laden: ${count("charge")} · Ersetzen: ${count("replace")} · Ohne Daten: ${count("none")}`;
  }
  function renderBatteryPanel() {

    $("batteryCurrent").textContent = `Status: ${state.label} | Letzte Prüfung: ${germanDate(last?.checked_at)} | Nächste Prüfung: ${germanDate(state.next || last?.next_check_at)} | Spannung: ${last?.resting_voltage ?? "—"} V`;
    const list = $("batteryHistory"); list.replaceChildren();
    if (!history.length) { list.textContent = "Noch keine Einträge."; return; }
    for (const h of history) {

      div.textContent = `${germanDate(h.checked_at)} · ${eventName}\nSpannung: ${h.resting_voltage ?? "—"} V · Tester: ${h.tester_result || "—"}\nNächste Prüfung: ${germanDate(h.next_check_at)}${h.notes ? "\nNotiz: " + h.notes : ""}`;

  /* МОДЕЛИ И ЦВЕТА */
  function getVehicleType(model) {
    const m = (model || "").toLowerCase();

    if (
      m.includes("f-150") ||
      m.includes("f150")
    ) return "f150";

    if (m.includes("puma")) return "puma";
    if (m.includes("transporter")) return "transporter";
    if (m.includes("transit")) return "transit";
    if (m.includes("ranger")) return "ranger";
    if (m.includes("kuga")) return "kuga";
    if (m.includes("capri")) return "capri";
    if (m.includes("focus")) return "focus";
    if (m.includes("opel")) return "opel";

    if (
      m.includes("škoda") ||
      m.includes("skoda")
    ) return "skoda";

    return "focus";
  }

  function getCarColor(color) {
    const c = (color || "").toLowerCase();

    if (
      c.includes("white") ||
      c.includes("weiß")
    ) return "#ffffff";

    if (
      c.includes("black") ||
      c.includes("schwarz")
    ) return "#171717";

    if (
      c.includes("red") ||
      c.includes("rot")
    ) return "#dc2626";

    if (c.includes("orange")) return "#f97316";

    if (
      c.includes("yellow") ||
      c.includes("gelb")
    ) return "#facc15";

    if (
      c.includes("green") ||
      c.includes("grün")
    ) return "#16a34a";

    if (
      c.includes("blue") ||
      c.includes("blau")
    ) return "#2563eb";

    if (
      c.includes("gray") ||
      c.includes("grey") ||
      c.includes("grau")
    ) return "#6b7280";

    if (
      c.includes("silver") ||
      c.includes("silber")
    ) return "#cbd5e1";

    return "#ffffff";
  }

  function carMatches(car) {
    const q = $("search").value.trim().toLowerCase();

    const text = [
      car.vin5 || "",
      car.vin_full || "",
      car.fahrnummer || "",
      car.model || ""
    ].join(" ").toLowerCase();

    if (q && !text.includes(q)) return false;

    if (
      $("modelFilter").value &&
      car.model !== $("modelFilter").value
    ) return false;

    if (
      $("colorFilter").value &&
      car.color !== $("colorFilter").value
    ) return false;

    if (isAdmin() && $("batteryFilter").value) {
      const state = batteryState(car).kind, filter = $("batteryFilter").value;
      if (state !== filter) return false;
    }
    return true;
  }

  function createCarGraphic(car) {
    const shape = document.createElement("div");

    shape.className =
      "carShape " + getVehicleType(car.model);

    shape.style.setProperty(
      "--car-color",
      getCarColor(car.color)
    );

    const parts = [
      "frontWindow",
      "roof",
      "rearWindow",
      "wheel fl",
      "wheel fr",
      "wheel rl",
      "wheel rr",
      "headlight left",
      "headlight right"
    ];

    parts.forEach(className => {
      const part = document.createElement("div");
      part.className = className;
      shape.appendChild(part);
    });

    return shape;
  }

  /* КООРДИНАТЫ НА ФОТО */
  function getMapPercent(clientX, clientY) {
    const rect =
      $("parkingImage").getBoundingClientRect();

    let x =
      ((clientX - rect.left) / rect.width) * 100;

    let y =
      ((clientY - rect.top) / rect.height) * 100;

    x = Math.max(0, Math.min(100, x));
    y = Math.max(0, Math.min(100, y));

    return {
      x: Number(x.toFixed(4)),
      y: Number(y.toFixed(4))
    };
  }

  /* РИСУЕМ МАШИНЫ */
  function renderCars() {
    if (dragInProgress) return;

    markers.innerHTML = "";
    let visibleCount = 0;

    cars.forEach(car => {
      if ((car.yard_status || "on_site") !== "on_site") return;
      if (
        car.position_x == null ||
        car.position_y == null
      ) return;

      const marker =
        document.createElement("button");

      marker.type = "button";
      marker.className = "marker";

      if (isAdmin()) {
        marker.classList.add("admin");
      }

      marker.style.left = car.position_x + "%";
      marker.style.top = car.position_y + "%";

      marker.appendChild(createCarGraphic(car));

      const vin = document.createElement("span");
      vin.className = "carVin";
      vin.textContent = car.vin5 || "?";
      marker.appendChild(vin);
      if (isAdmin()) {
        const state = batteryState(car);
        const dot = document.createElement("span");
        dot.className = "batteryDot " + state.kind;
        dot.textContent = state.kind === "ok" ? "✓" : state.kind === "none" ? "?" : "!";
        dot.title = "Batterie: " + state.label;
        marker.appendChild(dot);
      }

      marker.title = [
        car.model || "",
        car.vin5 || "",
        car.fahrnummer || ""
      ].filter(Boolean).join(" · ");

      if (!carMatches(car)) {
        marker.classList.add("hidden");
      } else {
        visibleCount++;
      }

      if (isAdmin()) {
        enableDrag(marker, car);
      }

      marker.addEventListener("click", () => {
        if (!dragging) {
          showCar(car);
        }
      });

      markers.appendChild(marker);
    });

    renderBatterySummary();
    setStatus(
      visibleCount +
      " Fahrzeug" +
      (visibleCount === 1 ? "" : "e") +
      " angezeigt · Automatische Aktualisierung aktiv"
    );
  }

  /* ПЕРЕТАСКИВАНИЕ — ТОЛЬКО АДМИНИСТРАТОР */
  function enableDrag(marker, car) {
    let startX = 0;
    let startY = 0;
    let moved = false;

    marker.addEventListener("pointerdown", event => {
      if (!isAdmin() || placementMode) return;

      dragging = false;
      moved = false;

      startX = event.clientX;
      startY = event.clientY;

      dragInProgress = true;
      marker.setPointerCapture(event.pointerId);
    });

    marker.addEventListener("pointermove", event => {
      if (
        !marker.hasPointerCapture(event.pointerId)
      ) return;

      const distance = Math.hypot(
        event.clientX - startX,
        event.clientY - startY
      );

      if (distance > 4) {
        moved = true;
        dragging = true;
        marker.classList.add("dragging");
      }

      if (!moved) return;

      const pos = getMapPercent(
        event.clientX,
        event.clientY
      );

      marker.style.left = pos.x + "%";
      marker.style.top = pos.y + "%";
    });

    marker.addEventListener("pointerup", async event => {
      if (
        !marker.hasPointerCapture(event.pointerId)
      ) return;

      marker.releasePointerCapture(event.pointerId);
      marker.classList.remove("dragging");

      if (!moved) {
        dragInProgress = false;
        return;
      }

      const pos = getMapPercent(
        event.clientX,
        event.clientY
      );

      savingInProgress = true;

      try {
        setStatus("Position wird gespeichert...");

        await apiRequest(
          `cars?id=eq.${car.id}`,
          {
            method: "PATCH",
            headers: {
              Prefer: "return=minimal"
            },
            body: JSON.stringify({
              position_x: pos.x,
              position_y: pos.y
            })
          }
        );

        car.position_x = pos.x;
        car.position_y = pos.y;

        /* Следующая проверка обновит и других зрителей. */
        lastCarsSnapshot = "";
        setStatus("Position gespeichert.");
      } catch (error) {
        console.error(error);
        alert(
          "Position konnte nicht gespeichert werden."
        );
      } finally {
        dragInProgress = false;
        savingInProgress = false;

        renderCars();

        setTimeout(() => {
          dragging = false;
        }, 100);

        loadCars(true);
      }
    });

    marker.addEventListener("pointercancel", () => {
      marker.classList.remove("dragging");
      dragInProgress = false;
      dragging = false;
      renderCars();
    });
  }

  /* КАРТОЧКА МАШИНЫ */
  function setSelectValue(select, value) {
    const exists = Array.from(select.options)
      .some(option => option.value === value);

    if (!exists && value) {
      const option =
        document.createElement("option");

      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    }

    select.value =
      value || select.options[0]?.value || "";
  }

  function updateMobileButton(url) {
    const button = $("mobileButton");

    if (url && /^https?:\/\//i.test(url)) {
      button.href = url;
      button.style.display = "block";
    } else {
      button.removeAttribute("href");
      button.style.display = "none";
    }
  }

  function showCar(car) {
    selectedCar = car;

    $("cardTitle").textContent =
      car.model || "Fahrzeug";

    $("editVin").value = car.vin5 || "";
    $("editVinFull").value = car.vin_full || "";

    $("editFahrnummer").value =
      car.fahrnummer || "";

    setSelectValue($("editModel"), car.model);
    setSelectValue($("editColor"), car.color);

    $("editMobileUrl").value =
      car.mobile_url || "";

    const admin = isAdmin();

    [
      "editVin",
      "editVinFull",
      "editFahrnummer",
      "editModel",
      "editColor",
      "editMobileUrl"
    ].forEach(id => {
      $(id).disabled = !admin;
    });

    $("saveCarButton").style.display =
      admin ? "block" : "none";

    $("deleteCarButton").style.display = admin && checksFor(car.id).length === 0 ? "block" : "none";
    $("batteryButton").style.display = admin ? "block" : "none";
    $("soldCarButton").style.display = admin && (car.yard_status || "on_site") === "on_site" ? "block" : "none";
    $("departedCarButton").style.display = admin && (car.yard_status || "on_site") === "on_site" ? "block" : "none";

    updateMobileButton(car.mobile_url);
    $("cardTitle").textContent = (car.model || "Fahrzeug") + ((car.yard_status || "on_site") === "on_site" ? "" : " · Archiv");

    addPanel.style.display = "none";
    card.style.display = "block";
  }

  $("closeCard").addEventListener("click", () => {
    selectedCar = null;
    card.style.display = "none";
  });

  /* СОХРАНЕНИЕ */
  $("saveCarButton").addEventListener(
    "click",
    async () => {
      if (!isAdmin() || !selectedCar) return;

      const vin = $("editVin").value.trim();

      const vinFull = $("editVinFull").value.trim().toUpperCase();
      if (vinFull && !/^[A-HJ-NPR-Z0-9]{17}$/.test(vinFull)) { alert("Vollständige VIN muss 17 Zeichen haben (ohne I, O, Q)."); return; }
      const fahrnummer =
        $("editFahrnummer").value.trim();

      const model = $("editModel").value;
      const color = $("editColor").value;

      const mobileUrl =
        $("editMobileUrl").value.trim();

      if (!vin || !fahrnummer) {
        alert(
          "Bitte VIN und Fahrzeugnummer eingeben."
        );
        return;
      }

      $("saveCarButton").disabled = true;
      savingInProgress = true;

      try {
        setStatus(
          "Änderungen werden gespeichert..."
        );

        await apiRequest(
          `cars?id=eq.${selectedCar.id}`,
          {
            method: "PATCH",
            headers: {
              Prefer: "return=minimal"
            },
            body: JSON.stringify({
              vin5: vin,
              vin_full: vinFull || null,
              fahrnummer,
              model,
              color,
              mobile_url: mobileUrl
            })
          }
        );

        Object.assign(selectedCar, {
          vin5: vin,
          vin_full: vinFull || null,
          fahrnummer,
          model,
          color,
          mobile_url: mobileUrl
        });

        $("cardTitle").textContent = model;
        updateMobileButton(mobileUrl);

        lastCarsSnapshot = "";
        renderCars();

        setStatus("Änderungen gespeichert.");
      } catch (error) {
        console.error(error);

        alert(
          "Änderungen konnten nicht gespeichert werden."
        );
      } finally {
        savingInProgress = false;
        $("saveCarButton").disabled = false;
        loadCars(true);
      }
    }
  );

  /* УДАЛЕНИЕ */
  $("deleteCarButton").addEventListener(
    "click",
    async () => {
      if (!isAdmin() || !selectedCar) return;
      if (checksFor(selectedCar.id).length) { alert("Batteriehistorie vorhanden. Bitte Fahrzeug archivieren, nicht löschen."); return; }
      const confirmed = confirm(
        `Fahrzeug ${
          selectedCar.vin5 || ""
        } wirklich löschen?`
      );

      if (!confirmed) return;

      const id = selectedCar.id;
      savingInProgress = true;

      try {
        setStatus("Fahrzeug wird gelöscht...");

        await apiRequest(
          `cars?id=eq.${id}`,
          {
            method: "DELETE",
            headers: {
              Prefer: "return=minimal"
            }
          }
        );

        cars = cars.filter(
          car => car.id !== id
        );

        selectedCar = null;
        card.style.display = "none";

        lastCarsSnapshot = "";
        renderCars();

        setStatus("Fahrzeug gelöscht.");
      } catch (error) {
        console.error(error);

        alert(
          "Fahrzeug konnte nicht gelöscht werden."
        );
      } finally {
        savingInProgress = false;
        loadCars(true);
      }
    }
  );

  /* ДОБАВЛЕНИЕ */
  $("addCarButton").addEventListener(
    "click",
    () => {
      if (!isAdmin()) return;

      selectedCar = null;
      closePanels();
      addPanel.style.display = "block";
    }
  );

  $("cancelAddButton").addEventListener(
    "click",
    () => {
      addPanel.style.display = "none";
      placementMode = false;
      pendingCar = null;

      $("placementMessage").style.display =
        "none";
    }
  );

  $("placeCarButton").addEventListener(
    "click",
    () => {
      if (!isAdmin()) return;

      const vin = $("newVin").value.trim();

      const fahrnummer =
        $("newFahrnummer").value.trim();

      if (!vin || !fahrnummer) {
        alert(
          "Bitte VIN und Fahrzeugnummer eingeben."
        );
        return;
      }

      const newVinFull = $("newVinFull").value.trim().toUpperCase();
      if (newVinFull && !/^[A-HJ-NPR-Z0-9]{17}$/.test(newVinFull)) { alert("Vollständige VIN muss 17 Zeichen haben."); return; }
      pendingCar = {
        vin5: vin,
        vin_full: newVinFull || null,
        fahrnummer,
        model: $("newModel").value,
        color: $("newColor").value,
        mobile_url:
          $("newMobileUrl").value.trim()
      };

      placementMode = true;
      addPanel.style.display = "none";

      $("placementMessage").textContent =
        "Klicke jetzt auf die gewünschte Position auf dem Parkplatz.";

      $("placementMessage").style.display =
        "block";
    }
  );

  mapWrapper.addEventListener(
    "click",
    async event => {
      if (
        !isAdmin() ||
        !placementMode ||
        !pendingCar
      ) return;

      if (event.target.closest(".marker")) {
        return;
      }

      const pos = getMapPercent(
        event.clientX,
        event.clientY
      );

      const newCar = {
        ...pendingCar,
        position_x: pos.x,
        position_y: pos.y
      };

      placementMode = false;
      savingInProgress = true;

      try {
        $("placementMessage").textContent =
          "Fahrzeug wird gespeichert...";

        const response = await apiRequest(
          "cars",
          {
            method: "POST",
            headers: {
              Prefer: "return=representation"
            },
            body: JSON.stringify(newCar)
          }
        );

        const created =
          await response.json();

        if (created[0]) {
          cars.push(created[0]);
        }

        pendingCar = null;

        $("placementMessage").style.display =
          "none";

        $("newVin").value = "";
        $("newVinFull").value = "";
        $("newFahrnummer").value = "";
        $("newMobileUrl").value = "";

        lastCarsSnapshot = "";
        renderCars();
      } catch (error) {
        console.error(error);

        alert(
          "Fahrzeug konnte nicht gespeichert werden."
        );

        placementMode = true;

        $("placementMessage").textContent =
          "Fehler beim Speichern. Bitte erneut auf den Parkplatz klicken.";
      } finally {
        savingInProgress = false;

        if (!placementMode) {
          loadCars(true);
          loadBatteryChecks();
        }
      }
    }
  );

  /* ПОИСК И ФИЛЬТРЫ */
  $("search").addEventListener(
    "input",
    renderCars
  );

  $("modelFilter").addEventListener(
    "change",
    renderCars
  );

  $("batteryFilter").addEventListener("change", renderCars);
  $("colorFilter").addEventListener(
    "change",
    renderCars
  );

  /* ЗАПУСК САЙТА */
  async function start() {
    await restoreSession();
    await loadCars(true);
    await loadBatteryChecks();

    /* Проверяем изменения каждые 3 секунды. */
    setInterval(() => {
      loadCars();
      if (isAdmin()) loadBatteryChecks();
    }, AUTO_REFRESH_MS);

    /* После возвращения на вкладку обновляем сразу. */
    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          loadCars(true);
        }
      }
    );
  }

  start();
</script>

</body>
</html>
