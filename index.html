<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parking Fahrzeugkarte</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #111;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    input,
    select,
    button {
      min-height: 42px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    input {
      flex: 1;
      min-width: 180px;
    }

    button {
      cursor: pointer;
    }

    #addCarButton {
      background: #16a34a;
      color: white;
      border: 0;
      font-weight: bold;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 16px;
    }

    #status {
      margin-bottom: 10px;
      font-size: 14px;
      color: #555;
    }

    #mapWrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #ddd;
      border: 1px solid #ccc;
      touch-action: auto;
    }

    #parkingImage {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    #markers {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 52px;
      height: 32px;
      padding: 0 8px;
      border: 2px solid white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,.45);
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
    }

    .marker:active {
      cursor: grabbing;
    }

    .marker.white {
      background: white;
      color: black;
      border-color: #333;
    }

    .marker.black {
      background: #111;
      color: white;
    }

    .marker.red {
      background: #dc2626;
      color: white;
    }

    .marker.orange {
      background: #f97316;
      color: black;
    }

    .marker.green {
      background: #16a34a;
      color: white;
    }

    .marker.hidden {
      opacity: .12;
    }

    #card,
    #addPanel {
      display: none;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 440px;
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
      z-index: 30;
    }

    #card {
      bottom: 20px;
    }

    #addPanel {
      top: 90px;
    }

    #card h2,
    #addPanel h2 {
      margin: 0 0 14px;
    }

    .row {
      margin: 7px 0;
    }

    .formRow {
      margin-bottom: 10px;
    }

    .formRow label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      font-weight: bold;
    }

    .formRow input,
    .formRow select {
      width: 100%;
    }

    .panelActions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .panelActions button {
      flex: 1;
    }

    #placeCarButton {
      background: #2563eb;
      color: white;
      border: 0;
    }

    #cancelAddButton {
      background: #eee;
    }

    #closeCard {
      float: right;
      border: 0;
      background: #eee;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 18px;
      padding: 0;
    }

    .mobileButton {
      display: block;
      margin-top: 14px;
      padding: 12px;
      text-align: center;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }

    #placementMessage {
      display: none;
      margin-bottom: 10px;
      padding: 10px 12px;
      background: #fff7cc;
      border: 1px solid #eab308;
      border-radius: 8px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      main {
        padding: 8px;
      }

      header {
        padding: 12px;
      }

      .marker {
        min-width: 46px;
        height: 30px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Parking · Fahrzeugkarte</h1>

  <div class="toolbar">
    <input
      id="search"
      type="search"
      placeholder="VIN oder Fahrnummer suchen"
    >

    <select id="modelFilter">
      <option value="">Alle Modelle</option>
      <option>Ford Transit</option>
      <option>Ford Transit Courier</option>
      <option>Ford Transit Custom</option>
      <option>Ford Puma</option>
      <option>Ford Kuga</option>
      <option>Ford Capri</option>
      <option>Ford Ranger</option>
      <option>Ford Ranger Wildtrak</option>
      <option>Ford Focus</option>
    </select>

    <select id="colorFilter">
      <option value="">Alle Farben</option>
      <option value="White">Weiß</option>
      <option value="Black">Schwarz</option>
      <option value="Red">Rot</option>
      <option value="Orange">Orange</option>
      <option value="Green">Grün</option>
    </select>

    <button id="addCarButton" type="button">
      + Fahrzeug hinzufügen
    </button>
  </div>
</header>

<main>

  <div id="status">Fahrzeuge werden geladen...</div>

  <div id="placementMessage">
    Klicke jetzt auf die gewünschte Position auf dem Parkplatz.
  </div>

  <div id="mapWrapper">
    <img
      id="parkingImage"
      src="./parking.png?v=3"
      alt="Parkplatz"
    >
    <div id="markers"></div>
  </div>

</main>

<div id="addPanel">
  <h2>Fahrzeug hinzufügen</h2>

  <div class="formRow">
    <label for="newVin">VIN</label>
    <input id="newVin" type="text" placeholder="z.B. 12345">
  </div>

  <div class="formRow">
    <label for="newFahrnummer">Fahrnummer</label>
    <input id="newFahrnummer" type="text" placeholder="z.B. 999">
  </div>

  <div class="formRow">
    <label for="newModel">Modell</label>
    <select id="newModel">
      <option>Ford Transit</option>
      <option>Ford Transit Courier</option>
      <option>Ford Transit Custom</option>
      <option>Ford Puma</option>
      <option>Ford Kuga</option>
      <option>Ford Capri</option>
      <option>Ford Ranger</option>
      <option>Ford Ranger Wildtrak</option>
      <option>Ford Focus</option>
    </select>
  </div>

  <div class="formRow">
    <label for="newColor">Farbe</label>
    <select id="newColor">
      <option value="White">Weiß</option>
      <option value="Black">Schwarz</option>
      <option value="Red">Rot</option>
      <option value="Orange">Orange</option>
      <option value="Green">Grün</option>
    </select>
  </div>

  <div class="formRow">
    <label for="newMobileUrl">Mobile.de URL (optional)</label>
    <input id="newMobileUrl" type="url" placeholder="https://...">
  </div>

  <div class="panelActions">
    <button id="cancelAddButton" type="button">
      Abbrechen
    </button>

    <button id="placeCarButton" type="button">
      Auf Parkplatz setzen
    </button>
  </div>
</div>

<div id="card">
  <button id="closeCard" type="button">×</button>

  <h2 id="cardModel"></h2>

  <div class="row">
    <strong>VIN:</strong>
    <span id="cardVin"></span>
  </div>

  <div class="row">
    <strong>Fahrnummer:</strong>
    <span id="cardFahrnummer"></span>
  </div>

  <div class="row">
    <strong>Farbe:</strong>
    <span id="cardColor"></span>
  </div>

  <a
    id="mobileButton"
    class="mobileButton"
    target="_blank"
    rel="noopener"
  >
    Mobile.de öffnen
  </a>
</div>

<script>

const SUPABASE_URL =
  "https://cydestwofhdfsmekwxho.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LNyn0n-rbQfu5AIMeAt9XQ_zqSpQ3Dh";

let cars = [];
let placementMode = false;
let pendingCar = null;
let dragged = false;

const markers =
  document.getElementById("markers");

const mapWrapper =
  document.getElementById("mapWrapper");

const search =
  document.getElementById("search");

const modelFilter =
  document.getElementById("modelFilter");

const colorFilter =
  document.getElementById("colorFilter");

const status =
  document.getElementById("status");

const addPanel =
  document.getElementById("addPanel");

const placementMessage =
  document.getElementById("placementMessage");

async function apiRequest(path, options = {}) {

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/" + path,
    {
      ...options,
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        ...(options.headers || {})
      }
    }
  );

  if (!response.ok) {
    throw new Error(await response.text());
  }

  return response;
}

async function loadCars() {

  try {

    const response = await apiRequest(
      "cars?select=*&order=id.asc"
    );

    cars = await response.json();

    renderCars();

  } catch (error) {

    console.error(error);

    status.textContent =
      "Fehler beim Laden der Fahrzeuge.";
  }
}

function getColorClass(color) {

  const c = (color || "").toLowerCase();

  if (
    c.includes("white") ||
    c.includes("weiß")
  ) return "white";

  if (
    c.includes("black") ||
    c.includes("schwarz")
  ) return "black";

  if (
    c.includes("red") ||
    c.includes("rot")
  ) return "red";

  if (c.includes("orange"))
    return "orange";

  if (
    c.includes("green") ||
    c.includes("grün")
  ) return "green";

  return "black";
}

function carMatches(car) {

  const q =
    search.value.trim().toLowerCase();

  const searchText =
    `${car.vin5 || ""} ${car.fahrnummer || ""}`
      .toLowerCase();

  if (q && !searchText.includes(q))
    return false;

  if (
    modelFilter.value &&
    car.model !== modelFilter.value
  )
    return false;

  if (
    colorFilter.value &&
    car.color !== colorFilter.value
  )
    return false;

  return true;
}

function renderCars() {

  markers.innerHTML = "";

  let visibleCount = 0;

  cars.forEach(car => {

    if (
      car.position_x == null ||
      car.position_y == null
    ) return;

    const marker =
      document.createElement("button");

    marker.type = "button";

    marker.className =
      "marker " + getColorClass(car.color);

    marker.style.left =
      car.position_x + "%";

    marker.style.top =
      car.position_y + "%";

    marker.textContent =
      car.vin5 || "?";

    if (!carMatches(car)) {

      marker.classList.add("hidden");

    } else {

      visibleCount++;
    }

    enableDrag(marker, car);

    marker.addEventListener(
      "click",
      () => {
        if (!dragged) {
          showCar(car);
        }
      }
    );

    markers.appendChild(marker);
  });

  status.textContent =
    visibleCount +
    " Fahrzeug" +
    (visibleCount === 1 ? "" : "e") +
    " angezeigt";
}

function enableDrag(marker, car) {

  let startX = 0;
  let startY = 0;

  marker.addEventListener(
    "pointerdown",
    event => {

      if (placementMode) return;

      dragged = false;

      startX = event.clientX;
      startY = event.clientY;

      marker.setPointerCapture(
        event.pointerId
      );
    }
  );

  marker.addEventListener(
    "pointermove",
    event => {

      if (
        !marker.hasPointerCapture(
          event.pointerId
        )
      ) return;

      const distance =
        Math.hypot(
          event.clientX - startX,
          event.clientY - startY
        );

      if (distance > 4) {
        dragged = true;
      }

      if (!dragged) return;

      const pos =
        getMapPercent(
          event.clientX,
          event.clientY
        );

      marker.style.left =
        pos.x + "%";

      marker.style.top =
        pos.y + "%";
    }
  );

  marker.addEventListener(
    "pointerup",
    async event => {

      if (
        !marker.hasPointerCapture(
          event.pointerId
        )
      ) return;

      marker.releasePointerCapture(
        event.pointerId
      );

      if (!dragged) return;

      const pos =
        getMapPercent(
          event.clientX,
          event.clientY
        );

      try {

        status.textContent =
          "Position wird gespeichert...";

        await apiRequest(
          `cars?id=eq.${car.id}`,
          {
            method: "PATCH",
            headers: {
              Prefer: "return=minimal"
            },
            body: JSON.stringify({
              position_x: pos.x,
              position_y: pos.y
            })
          }
        );

        car.position_x = pos.x;
        car.position_y = pos.y;

        status.textContent =
          "Position gespeichert.";

        setTimeout(
          renderCars,
          500
        );

      } catch (error) {

        console.error(error);

        alert(
          "Position konnte nicht gespeichert werden."
        );

        renderCars();
      }
    }
  );
}

function getMapPercent(clientX, clientY) {

  const rect =
    mapWrapper.getBoundingClientRect();

  let x =
    ((clientX - rect.left) /
      rect.width) * 100;

  let y =
    ((clientY - rect.top) /
      rect.height) * 100;

  x = Math.max(0, Math.min(100, x));
  y = Math.max(0, Math.min(100, y));

  return {
    x: Number(x.toFixed(2)),
    y: Number(y.toFixed(2))
  };
}

function showCar(car) {

  document.getElementById(
    "cardModel"
  ).textContent =
    car.model || "Fahrzeug";

  document.getElementById(
    "cardVin"
  ).textContent =
    car.vin5 || "-";

  document.getElementById(
    "cardFahrnummer"
  ).textContent =
    car.fahrnummer || "-";

  document.getElementById(
    "cardColor"
  ).textContent =
    car.color || "-";

  const mobileButton =
    document.getElementById(
      "mobileButton"
    );

  if (car.mobile_url) {

    mobileButton.href =
      car.mobile_url;

    mobileButton.style.display =
      "block";

  } else {

    mobileButton.style.display =
      "none";
  }

  document.getElementById(
    "card"
  ).style.display =
    "block";
}

document.getElementById(
  "addCarButton"
).addEventListener(
  "click",
  () => {

    addPanel.style.display =
      "block";
  }
);

document.getElementById(
  "cancelAddButton"
).addEventListener(
  "click",
  () => {

    addPanel.style.display =
      "none";

    placementMode = false;
    pendingCar = null;

    placementMessage.style.display =
      "none";
  }
);

document.getElementById(
  "placeCarButton"
).addEventListener(
  "click",
  () => {

    const vin =
      document.getElementById(
        "newVin"
      ).value.trim();

    const fahrnummer =
      document.getElementById(
        "newFahrnummer"
      ).value.trim();

    if (!vin || !fahrnummer) {

      alert(
        "Bitte VIN und Fahrnummer eingeben."
      );

      return;
    }

    pendingCar = {
      vin5: vin,
      fahrnummer:
        fahrnummer,
      model:
        document.getElementById(
          "newModel"
        ).value,
      color:
        document.getElementById(
          "newColor"
        ).value,
      mobile_url:
        document.getElementById(
          "newMobileUrl"
        ).value.trim()
    };

    placementMode = true;

    addPanel.style.display =
      "none";

    placementMessage.style.display =
      "block";
  }
);

mapWrapper.addEventListener(
  "click",
  async event => {

    if (!placementMode) return;

    if (
      event.target.classList.contains(
        "marker"
      )
    ) return;

    const pos =
      getMapPercent(
        event.clientX,
        event.clientY
      );

    const newCar = {
      ...pendingCar,
      position_x: pos.x,
      position_y: pos.y
    };

    try {

      placementMessage.textContent =
        "Fahrzeug wird gespeichert...";

      const response =
        await apiRequest(
          "cars",
          {
            method: "POST",
            headers: {
              Prefer:
                "return=representation"
            },
            body:
              JSON.stringify(newCar)
          }
        );

      const created =
        await response.json();

      if (created[0]) {
        cars.push(created[0]);
      }

      placementMode = false;
      pendingCar = null;

      placementMessage.style.display =
        "none";

      clearAddForm();

      renderCars();

    } catch (error) {

      console.error(error);

      placementMessage.textContent =
        "Fehler beim Speichern.";

      alert(
        "Fahrzeug konnte nicht gespeichert werden."
      );
    }
  }
);

function clearAddForm() {

  document.getElementById(
    "newVin"
  ).value = "";

  document.getElementById(
    "newFahrnummer"
  ).value = "";

  document.getElementById(
    "newMobileUrl"
  ).value = "";
}

document.getElementById(
  "closeCard"
).addEventListener(
  "click",
  () => {

    document.getElementById(
      "card"
    ).style.display =
      "none";
  }
);

search.addEventListener(
  "input",
  renderCars
);

modelFilter.addEventListener(
  "change",
  renderCars
);

colorFilter.addEventListener(
  "change",
  renderCars
);

loadCars();

</script>

</body>
</html>
