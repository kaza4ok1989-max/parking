<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parking Fahrzeugkarte</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #111;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    input,
    select {
      min-height: 42px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    input {
      flex: 1;
      min-width: 220px;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 16px;
    }

    #status {
      margin-bottom: 10px;
      font-size: 14px;
      color: #555;
    }

    #mapWrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #ddd;
      border: 1px solid #ccc;
    }

    #parkingImage {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }

    #markers {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 48px;
      height: 30px;
      padding: 0 8px;
      border: 2px solid white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,.45);
      cursor: pointer;
      pointer-events: auto;
    }

    .marker.white {
      background: white;
      color: black;
      border-color: #333;
    }

    .marker.black {
      background: #111;
      color: white;
    }

    .marker.red {
      background: #dc2626;
      color: white;
    }

    .marker.orange {
      background: #f97316;
      color: black;
    }

    .marker.green {
      background: #16a34a;
      color: white;
    }

    .marker.hidden {
      opacity: .12;
    }

    #card {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 420px;
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
      z-index: 20;
    }

    #card h2 {
      margin: 0 0 12px;
    }

    .row {
      margin: 7px 0;
    }

    .mobileButton {
      display: block;
      margin-top: 14px;
      padding: 12px;
      text-align: center;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }

    #closeCard {
      float: right;
      border: 0;
      background: #eee;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 18px;
    }

    @media (max-width: 600px) {
      main {
        padding: 8px;
      }

      header {
        padding: 12px;
      }

      .marker {
        min-width: 44px;
        height: 28px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Parking · Fahrzeugkarte</h1>

  <div class="filters">
    <input
      id="search"
      type="search"
      placeholder="VIN oder Fahrnummer suchen"
    >

    <select id="modelFilter">
      <option value="">Alle Modelle</option>
      <option>Ford Transit</option>
      <option>Ford Transit Courier</option>
      <option>Ford Transit Custom</option>
      <option>Ford Puma</option>
      <option>Ford Kuga</option>
      <option>Ford Capri</option>
      <option>Ford Ranger</option>
      <option>Ford Ranger Wildtrak</option>
      <option>Ford Focus</option>
    </select>

    <select id="colorFilter">
      <option value="">Alle Farben</option>
      <option value="White">Weiß</option>
      <option value="Black">Schwarz</option>
      <option value="Red">Rot</option>
      <option value="Orange">Orange</option>
      <option value="Green">Grün</option>
    </select>
  </div>
</header>

<main>

  <div id="status">Fahrzeuge werden geladen...</div>

  <div id="mapWrapper">
    <img
      id="parkingImage"
      src="./parking.png?v=3"
      alt="Parkplatz"
    >
    <div id="markers"></div>
  </div>

</main>

<div id="card">
  <button id="closeCard">×</button>

  <h2 id="cardModel"></h2>

  <div class="row">
    <strong>VIN:</strong>
    <span id="cardVin"></span>
  </div>

  <div class="row">
    <strong>Fahrnummer:</strong>
    <span id="cardFahrnummer"></span>
  </div>

  <div class="row">
    <strong>Farbe:</strong>
    <span id="cardColor"></span>
  </div>

  <a
    id="mobileButton"
    class="mobileButton"
    target="_blank"
    rel="noopener"
  >
    Mobile.de öffnen
  </a>
</div>

<script>

const SUPABASE_URL =
  "https://cydestwofhdfsmekwxho.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LNyn0n-rbQfu5AIMeAt9XQ_zqSpQ3Dh";

let cars = [];

const markers =
  document.getElementById("markers");

const search =
  document.getElementById("search");

const modelFilter =
  document.getElementById("modelFilter");

const colorFilter =
  document.getElementById("colorFilter");

const status =
  document.getElementById("status");

async function loadCars() {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/cars?select=*&order=id.asc",
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization:
            "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error(
        await response.text()
      );
    }

    cars = await response.json();

    renderCars();

  } catch (error) {

    console.error(error);

    status.textContent =
      "Fehler beim Laden der Fahrzeuge.";

  }
}

function getColorClass(color) {

  const c =
    (color || "").toLowerCase();

  if (
    c.includes("white") ||
    c.includes("weiß")
  ) {
    return "white";
  }

  if (
    c.includes("black") ||
    c.includes("schwarz")
  ) {
    return "black";
  }

  if (
    c.includes("red") ||
    c.includes("rot")
  ) {
    return "red";
  }

  if (c.includes("orange")) {
    return "orange";
  }

  if (
    c.includes("green") ||
    c.includes("grün")
  ) {
    return "green";
  }

  return "black";
}

function carMatches(car) {

  const q =
    search.value
      .trim()
      .toLowerCase();

  const searchText =
    `${car.vin5 || ""} ${car.fahrnummer || ""}`
      .toLowerCase();

  if (
    q &&
    !searchText.includes(q)
  ) {
    return false;
  }

  if (
    modelFilter.value &&
    car.model !== modelFilter.value
  ) {
    return false;
  }

  if (
    colorFilter.value &&
    car.color !== colorFilter.value
  ) {
    return false;
  }

  return true;
}

function renderCars() {

  markers.innerHTML = "";

  let visibleCount = 0;

  cars.forEach(car => {

    if (
      car.position_x == null ||
      car.position_y == null
    ) {
      return;
    }

    const marker =
      document.createElement("button");

    marker.type = "button";

    marker.className =
      "marker " +
      getColorClass(car.color);

    marker.style.left =
      car.position_x + "%";

    marker.style.top =
      car.position_y + "%";

    marker.textContent =
      car.vin5 || "?";

    if (!carMatches(car)) {

      marker.classList.add(
        "hidden"
      );

    } else {

      visibleCount++;

    }

    marker.addEventListener(
      "click",
      () => showCar(car)
    );

    markers.appendChild(marker);

  });

  status.textContent =
    visibleCount +
    " Fahrzeug" +
    (visibleCount === 1 ? "" : "e") +
    " angezeigt";
}

function showCar(car) {

  document.getElementById(
    "cardModel"
  ).textContent =
    car.model || "Fahrzeug";

  document.getElementById(
    "cardVin"
  ).textContent =
    car.vin5 || "-";

  document.getElementById(
    "cardFahrnummer"
  ).textContent =
    car.fahrnummer || "-";

  document.getElementById(
    "cardColor"
  ).textContent =
    car.color || "-";

  const mobileButton =
    document.getElementById(
      "mobileButton"
    );

  if (car.mobile_url) {

    mobileButton.href =
      car.mobile_url;

    mobileButton.style.display =
      "block";

  } else {

    mobileButton.style.display =
      "none";

  }

  document.getElementById(
    "card"
  ).style.display =
    "block";
}

document.getElementById(
  "closeCard"
).addEventListener(
  "click",
  () => {

    document.getElementById(
      "card"
    ).style.display =
      "none";

  }
);

search.addEventListener(
  "input",
  renderCars
);

modelFilter.addEventListener(
  "change",
  renderCars
);

colorFilter.addEventListener(
  "change",
  renderCars
);

loadCars();

</script>

</body>
</html>
