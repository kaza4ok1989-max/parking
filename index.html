<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Parking Fahrzeugkarte</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #111;
    }

    header {
      background: #111827;
      color: white;
      padding: 16px;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    input,
    select,
    button {
      min-height: 42px;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    input {
      flex: 1;
      min-width: 180px;
    }

    button {
      cursor: pointer;
    }

    #addCarButton {
      background: #16a34a;
      color: white;
      border: 0;
      font-weight: bold;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 16px;
    }

    #status {
      margin-bottom: 10px;
      font-size: 14px;
      color: #555;
    }

    #placementMessage {
      display: none;
      margin-bottom: 10px;
      padding: 10px 12px;
      background: #fff7cc;
      border: 1px solid #eab308;
      border-radius: 8px;
      font-weight: bold;
    }

    #mapWrapper {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #ddd;
      border: 1px solid #ccc;
    }

    #parkingImage {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    #markers {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .marker {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 78px;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      cursor: grab;
      pointer-events: auto;
      touch-action: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }

    .marker:active {
      cursor: grabbing;
    }

    .marker.hidden {
      opacity: 0.12;
    }

    .carShape {
      position: relative;
      width: 34px;
      height: 58px;
      background: var(--car-color, #ffffff);
      border: 2px solid #222;
      border-radius: 10px 10px 7px 7px;
      box-shadow: 0 3px 8px rgba(0,0,0,.45);
      flex-shrink: 0;
    }

    .carShape.van {
      width: 36px;
      height: 62px;
      border-radius: 7px;
    }

    .carShape.pickup {
      width: 36px;
      height: 60px;
    }

    .carShape.car {
      width: 34px;
      height: 54px;
    }

    .frontWindow {
      position: absolute;
      top: 8px;
      left: 5px;
      right: 5px;
      height: 13px;
      background: #374151;
      border-radius: 5px 5px 2px 2px;
      border: 1px solid rgba(255,255,255,.35);
    }

    .rearWindow {
      position: absolute;
      bottom: 8px;
      left: 6px;
      right: 6px;
      height: 11px;
      background: #374151;
      border-radius: 2px 2px 4px 4px;
      border: 1px solid rgba(255,255,255,.35);
    }

    .carRoof {
      position: absolute;
      top: 24px;
      bottom: 22px;
      left: 5px;
      right: 5px;
      border-radius: 4px;
      border: 1px solid rgba(0,0,0,.25);
    }

    .wheel {
      position: absolute;
      width: 5px;
      height: 13px;
      background: #111;
      border-radius: 3px;
    }

    .wheel.fl {
      top: 11px;
      left: -5px;
    }

    .wheel.fr {
      top: 11px;
      right: -5px;
    }

    .wheel.rl {
      bottom: 10px;
      left: -5px;
    }

    .wheel.rr {
      bottom: 10px;
      right: -5px;
    }

    .headlight {
      position: absolute;
      top: 2px;
      width: 7px;
      height: 4px;
      background: #fef08a;
      border-radius: 2px;
    }

    .headlight.left {
      left: 5px;
    }

    .headlight.right {
      right: 5px;
    }

    .carVin {
      margin-top: 3px;
      min-width: 38px;
      padding: 2px 4px;
      background: white;
      color: #111;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 9px;
      line-height: 12px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.3);
    }

    #card,
    #addPanel {
      display: none;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 30px);
      max-width: 440px;
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,.3);
      z-index: 30;
    }

    #card {
      bottom: 20px;
    }

    #addPanel {
      top: 90px;
    }

    #card h2,
    #addPanel h2 {
      margin: 0 0 14px;
    }

    .row {
      margin: 7px 0;
    }

    .formRow {
      margin-bottom: 10px;
    }

    .formRow label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .formRow input,
    .formRow select {
      width: 100%;
    }

    .panelActions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .panelActions button {
      flex: 1;
    }

    #placeCarButton {
      background: #2563eb;
      color: white;
      border: 0;
    }

    #cancelAddButton {
      background: #eee;
    }

    #closeCard {
      float: right;
      border: 0;
      background: #eee;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 18px;
      padding: 0;
    }

    #saveCarButton {
      width: 100%;
      margin-top: 12px;
      background: #2563eb;
      color: white;
      border: 0;
      font-weight: bold;
    }

    #deleteCarButton {
      width: 100%;
      margin-top: 8px;
      background: #dc2626;
      color: white;
      border: 0;
      font-weight: bold;
    }

    .mobileButton {
      display: block;
      margin-top: 12px;
      padding: 12px;
      text-align: center;
      background: #16a34a;
      color: white;
      border-radius: 8px;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      main {
        padding: 8px;
      }

      header {
        padding: 12px;
      }

      .marker {
        width: 48px;
        height: 70px;
      }

      .carShape {
        transform: scale(.9);
      }
    }
  </style>
</head>

<body>

  <div id="mapWrapper">

      <option>Ford Transit Custom</option>
      <option>Ford Puma</option>
      <option>Ford Kuga</option>

      <option>Ford Ranger</option>

      <option>Ford Focus</option>
    </select>
  </div>

  <div class="formRow">

    <select id="editColor">

<script>

const SUPABASE_URL =
  "https://cydestwofhdfsmekwxho.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LNyn0n-rbQfu5AIMeAt9XQ_zqSpQ3Dh";


let cars = [];

let placementMode = false;

let pendingCar = null;

let dragged = false;

let selectedCar = null;


const markers =
  document.getElementById("markers");

const mapWrapper =
  document.getElementById("mapWrapper");

const search =
  document.getElementById("search");

const modelFilter =
  document.getElementById("modelFilter");

const colorFilter =
  document.getElementById("colorFilter");

const status =
  document.getElementById("status");

const addPanel =
  document.getElementById("addPanel");

const placementMessage =
  document.getElementById("placementMessage");


async function apiRequest(path, options = {}) {

  const response =
    await fetch(
      SUPABASE_URL + "/rest/v1/" + path,
      {
        ...options,

        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      }
    );


  if (!response.ok) {

    throw new Error(
      await response.text()
    );

  }


  return response;
}


async function loadCars() {

  try {

    const response =
      await apiRequest(
        "cars?select=*&order=id.asc"
      );

    cars =
      await response.json();

    renderCars();

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Fehler beim Laden der Fahrzeuge.";

  }

}


function getCarColor(color) {

  const c =
    (color || "").toLowerCase();


  if (
    c.includes("white") ||
    c.includes("weiß")
  ) {
    return "#ffffff";
  }


  if (
    c.includes("black") ||
    c.includes("schwarz")
  ) {
    return "#171717";
  }


  if (
    c.includes("red") ||
    c.includes("rot")
  ) {
    return "#dc2626";
  }


  if (c.includes("orange")) {
    return "#f97316";
  }


  if (
    c.includes("green") ||
    c.includes("grün")
  ) {
    return "#16a34a";
  }


  if (
    c.includes("blue") ||
    c.includes("blau")
  ) {
    return "#2563eb";
  }


  if (
    c.includes("gray") ||
    c.includes("grey") ||
    c.includes("grau")
  ) {
    return "#6b7280";
  }


  if (
    c.includes("silver") ||
    c.includes("silber")
  ) {
    return "#c0c0c0";
  }


  return "#6b7280";
}


function getVehicleType(model) {

  const m =
    (model || "").toLowerCase();


  if (m.includes("ranger")) {
    return "pickup";
  }


  if (m.includes("transit")) {
    return "van";
  }


  return "car";
}


function carMatches(car) {

  const q =
    search.value
      .trim()
      .toLowerCase();


  const searchText =
    `${car.vin5 || ""} ${car.fahrnummer || ""}`
      .toLowerCase();


  if (
    q &&
    !searchText.includes(q)
  ) {
    return false;
  }


  if (
    modelFilter.value &&
    car.model !== modelFilter.value
  ) {
    return false;
  }


  if (
    colorFilter.value &&
    car.color !== colorFilter.value
  ) {
    return false;
  }


  return true;
}


function createCarGraphic(car) {

  const shape =
    document.createElement("div");


  shape.className =
    "carShape " +
    getVehicleType(car.model);


  shape.style.setProperty(
    "--car-color",
    getCarColor(car.color)
  );


  const frontWindow =
    document.createElement("div");

  frontWindow.className =
    "frontWindow";


  const roof =
    document.createElement("div");

  roof.className =
    "carRoof";


  const rearWindow =
    document.createElement("div");

  rearWindow.className =
    "rearWindow";


  const wheelFL =
    document.createElement("div");

  wheelFL.className =
    "wheel fl";


  const wheelFR =
    document.createElement("div");

  wheelFR.className =
    "wheel fr";


  const wheelRL =
    document.createElement("div");

  wheelRL.className =
    "wheel rl";


  const wheelRR =
    document.createElement("div");

  wheelRR.className =
    "wheel rr";


  const lightLeft =
    document.createElement("div");

  lightLeft.className =
    "headlight left";


  const lightRight =
    document.createElement("div");

  lightRight.className =
    "headlight right";


  shape.appendChild(frontWindow);
  shape.appendChild(roof);
  shape.appendChild(rearWindow);
  shape.appendChild(wheelFL);
  shape.appendChild(wheelFR);
  shape.appendChild(wheelRL);
  shape.appendChild(wheelRR);
  shape.appendChild(lightLeft);
  shape.appendChild(lightRight);


  return shape;
}


function renderCars() {

  markers.innerHTML = "";

  let visibleCount = 0;


  cars.forEach(car => {


    if (
      car.position_x == null ||
      car.position_y == null
    ) {
      return;
    }


    const marker =
      document.createElement("button");


    marker.type = "button";

    marker.className = "marker";

    marker.style.left =
      car.position_x + "%";

    marker.style.top =
      car.position_y + "%";


    const carGraphic =
      createCarGraphic(car);

    marker.appendChild(carGraphic);


    const vinLabel =
      document.createElement("span");

    vinLabel.className =
      "carVin";

    vinLabel.textContent =
      car.vin5 || "?";

    marker.appendChild(vinLabel);


    if (!carMatches(car)) {

      marker.classList.add("hidden");

    }

    else {

      visibleCount++;

    }


    enableDrag(marker, car);


    marker.addEventListener(
      "click",
      () => {

        if (!dragged) {
          showCar(car);
        }

      }
    );


    markers.appendChild(marker);

  });


  status.textContent =
    visibleCount +
    " Fahrzeug" +
    (visibleCount === 1 ? "" : "e") +
    " angezeigt";

}


function enableDrag(marker, car) {

  let startX = 0;
  let startY = 0;


  marker.addEventListener(
    "pointerdown",
    event => {

      if (placementMode) {
        return;
      }

      dragged = false;

      startX =
        event.clientX;

      startY =
        event.clientY;

      marker.setPointerCapture(
        event.pointerId
      );

    }
  );


  marker.addEventListener(
    "pointermove",
    event => {

      if (
        !marker.hasPointerCapture(
          event.pointerId
        )
      ) {
        return;
      }


      const distance =
        Math.hypot(
          event.clientX - startX,
          event.clientY - startY
        );


      if (distance > 4) {
        dragged = true;
      }


      if (!dragged) {
        return;
      }


      const pos =
        getMapPercent(
          event.clientX,
          event.clientY
        );


      marker.style.left =
        pos.x + "%";

      marker.style.top =
        pos.y + "%";

    }
  );


  marker.addEventListener(
    "pointerup",
    async event => {

      if (
        !marker.hasPointerCapture(
          event.pointerId
        )
      ) {
        return;
      }


      marker.releasePointerCapture(
        event.pointerId
      );


      if (!dragged) {
        return;
      }


      const pos =
        getMapPercent(
          event.clientX,
          event.clientY
        );


      try {

        status.textContent =
          "Position wird gespeichert...";


        await apiRequest(
          `cars?id=eq.${car.id}`,
          {
            method: "PATCH",

            headers: {
              Prefer: "return=minimal"
            },

            body: JSON.stringify({
              position_x: pos.x,
              position_y: pos.y
            })
          }
        );


        car.position_x = pos.x;
        car.position_y = pos.y;


        status.textContent =
          "Position gespeichert.";


        setTimeout(
          renderCars,
          300
        );

      }

      catch (error) {

        console.error(error);

        alert(
          "Position konnte nicht gespeichert werden."
        );

        renderCars();

      }

    }
  );

}


function getMapPercent(
  clientX,
  clientY
) {

  const rect =
    mapWrapper.getBoundingClientRect();


  let x =
    ((clientX - rect.left) / rect.width) * 100;


  let y =
    ((clientY - rect.top) / rect.height) * 100;


  x =
    Math.max(
      0,
      Math.min(100, x)
    );


  y =
    Math.max(
      0,
      Math.min(100, y)
    );


  return {
    x: Number(x.toFixed(2)),
    y: Number(y.toFixed(2))
  };

}


function showCar(car) {

  selectedCar = car;


  document.getElementById(
    "cardTitle"
  ).textContent =
    car.model || "Fahrzeug";


  document.getElementById(
    "cardVin"
  ).textContent =
    car.vin5 || "-";


  document.getElementById(
    "cardFahrnummer"
  ).textContent =
    car.fahrnummer || "-";


  document.getElementById(
    "editModel"
  ).value =
    car.model || "Ford Transit";


  document.getElementById(
    "editColor"
  ).value =
    car.color || "White";


  const mobileButton =
    document.getElementById(
      "mobileButton"
    );


  if (car.mobile_url) {

    mobileButton.href =
      car.mobile_url;

    mobileButton.style.display =
      "block";

  }

  else {

    mobileButton.style.display =
      "none";

  }


  document.getElementById(
    "card"
  ).style.display =
    "block";

}


document.getElementById(
  "saveCarButton"
).addEventListener(
  "click",
  async () => {

    if (!selectedCar) {
      return;
    }


    const newModel =
      document.getElementById(
        "editModel"
      ).value;


    const newColor =
      document.getElementById(
        "editColor"
      ).value;


    try {

      status.textContent =
        "Änderungen werden gespeichert...";


      await apiRequest(
        `cars?id=eq.${selectedCar.id}`,
        {
          method: "PATCH",

          headers: {
            Prefer: "return=minimal"
          },

          body: JSON.stringify({
            model: newModel,
            color: newColor
          })
        }
      );


      selectedCar.model =
        newModel;

      selectedCar.color =
        newColor;


      document.getElementById(
        "cardTitle"
      ).textContent =
        newModel;


      renderCars();


      status.textContent =
        "Änderungen gespeichert.";

    }

    catch (error) {

      console.error(error);

      alert(
        "Änderungen konnten nicht gespeichert werden."
      );

    }

  }
);


document.getElementById(
  "deleteCarButton"
).addEventListener(
  "click",
  async () => {

    if (!selectedCar) {
      return;
    }


    const vin =
      selectedCar.vin5 || "";


    const confirmed =
      confirm(
        `Fahrzeug ${vin} wirklich löschen?`
      );


    if (!confirmed) {
      return;
    }


    try {

      status.textContent =
        "Fahrzeug wird gelöscht...";


      await apiRequest(
        `cars?id=eq.${selectedCar.id}`,
        {
          method: "DELETE",

          headers: {
            Prefer: "return=minimal"
          }
        }
      );


      cars =
        cars.filter(
          car =>
            car.id !== selectedCar.id
        );


      selectedCar = null;


      document.getElementById(
        "card"
      ).style.display =
        "none";


      renderCars();


      status.textContent =
        "Fahrzeug gelöscht.";

    }

    catch (error) {

      console.error(error);

      alert(
        "Fahrzeug konnte nicht gelöscht werden."
      );

    }

  }
);


document.getElementById(
  "addCarButton"
).addEventListener(
  "click",
  () => {

    addPanel.style.display =
      "block";

  }
);


document.getElementById(
  "cancelAddButton"
).addEventListener(
  "click",
  () => {

    addPanel.style.display =
      "none";

    placementMode =
      false;

    pendingCar =
      null;

    placementMessage.style.display =
      "none";

  }
);


document.getElementById(
  "placeCarButton"
).addEventListener(
  "click",
  () => {

    const vin =
      document.getElementById(
        "newVin"
      ).value.trim();


    const fahrnummer =
      document.getElementById(
        "newFahrnummer"
      ).value.trim();


    if (!vin || !fahrnummer) {

      alert(
        "Bitte VIN und Fahrnummer eingeben."
      );

      return;
    }


    pendingCar = {

      vin5: vin,

      fahrnummer: fahrnummer,

      model:
        document.getElementById(
          "newModel"
        ).value,

      color:
        document.getElementById(
          "newColor"
        ).value,

      mobile_url:
        document.getElementById(
          "newMobileUrl"
        ).value.trim()

    };


    placementMode =
      true;


    addPanel.style.display =
      "none";


    placementMessage.style.display =
      "block";

  }
);


mapWrapper.addEventListener(
  "click",
  async event => {

    if (!placementMode) {
      return;
    }


    if (
      event.target.closest(".marker")
    ) {
      return;
    }


    const pos =
      getMapPercent(
        event.clientX,
        event.clientY
      );


    const newCar = {

      ...pendingCar,

      position_x: pos.x,

      position_y: pos.y

    };


    try {

      placementMessage.textContent =
        "Fahrzeug wird gespeichert...";


      const response =
        await apiRequest(
          "cars",
          {
            method: "POST",

            headers: {
              Prefer: "return=representation"
            },

            body:
              JSON.stringify(newCar)
          }
        );


      const created =
        await response.json();


      if (created[0]) {

        cars.push(created[0]);

      }


      placementMode =
        false;

      pendingCar =
        null;


      placementMessage.style.display =
        "none";


      clearAddForm();


      renderCars();

    }

    catch (error) {

      console.error(error);


      placementMessage.textContent =
        "Fehler beim Speichern.";


      alert(
        "Fahrzeug konnte nicht gespeichert werden."
      );

    }

  }
);


function clearAddForm() {

  document.getElementById(
    "newVin"
  ).value = "";


  document.getElementById(
    "newFahrnummer"
  ).value = "";


  document.getElementById(
    "newMobileUrl"
  ).value = "";

}


document.getElementById(
  "closeCard"
).addEventListener(
  "click",
  () => {

    selectedCar = null;

    document.getElementById(
      "card"
    ).style.display =
      "none";

  }
);


search.addEventListener(
  "input",
  renderCars
);


modelFilter.addEventListener(
  "change",
  renderCars
);


colorFilter.addEventListener(
  "change",
  renderCars
);


loadCars();

</script>

</body>
</html>
